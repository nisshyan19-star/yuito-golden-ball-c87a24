<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>描画エンジン目視確認 [dev]</title>
  <style>
    html,body {
      margin: 0;
      height: 100%;
      background: #0b0b12;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
      background: #000;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>

<!-- エンジンファイルを ORDER 順に読み込む -->
<script src="src/data/sprites.js"></script>
<script src="src/engine/canvas.js"></script>
<script src="src/engine/render.js"></script>

<script>
(function () {
  // ────────────────────────────────────────
  // 1. キャンバス初期化
  // ────────────────────────────────────────
  var canvas = document.getElementById('game');
  SRPG.initCanvas(canvas);
  var ctx = SRPG.getCtx();

  function draw() {
    var VW = SRPG.VW;  // 240
    var VH = SRPG.VH;  // 320

    // ────────────────────────────────────────
    // 2. 背景塗りつぶし
    // ────────────────────────────────────────
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, VW, VH);

    // ────────────────────────────────────────
    // 3. タイトルテキスト（上部）
    // ────────────────────────────────────────
    SRPG.drawText(ctx, 'ユイトと黄金のサッカーボール', 120, 6, {
      size: 11, color: '#ffd700', align: 'center'
    });

    // ────────────────────────────────────────
    // 4. タイル5種の個別サンプル（横一列）
    // ────────────────────────────────────────
    var tileKeys = ['t_grass', 't_road', 't_wall', 't_water', 't_floor'];
    var tileLabels = ['草', '道', '壁', '水', '床'];
    var tileY = 24;
    for (var t = 0; t < tileKeys.length; t++) {
      SRPG.drawSprite(ctx, SRPG.SPRITES[tileKeys[t]], 8 + t * 46, tileY, 1);
      SRPG.drawText(ctx, tileLabels[t], 16 + t * 46, tileY + 18, {
        size: 9, color: '#cccccc', align: 'center'
      });
    }

    // ────────────────────────────────────────
    // 5. ミニマップ（drawTileMap）
    // ────────────────────────────────────────
    // 草=G 道=R 壁=W 水=A（t_waterのキーとして'A'を使わず文字マップを直接指定）
    // drawTileMap の grid は文字の2次元配列。tileSprites のキーに合わせる。
    var miniGrid = [
      ['g', 'g', 'r', 'r', 'r', 'g', 'g', 'w', 'w', 'a'],
      ['g', 'g', 'r', 'g', 'r', 'g', 'g', 'w', 'a', 'a'],
      ['g', 'r', 'r', 'g', 'r', 'r', 'g', 'w', 'a', 'a'],
      ['g', 'r', 'g', 'g', 'g', 'r', 'g', 'w', 'w', 'a'],
      ['g', 'r', 'r', 'r', 'r', 'r', 'g', 'g', 'w', 'a'],
    ];
    // 文字→スプライトキーのマップ
    var miniTiles = {
      'g': SRPG.SPRITES.t_grass,
      'r': SRPG.SPRITES.t_road,
      'w': SRPG.SPRITES.t_wall,
      'a': SRPG.SPRITES.t_water,
      'f': SRPG.SPRITES.t_floor,
    };
    SRPG.drawTileMap(ctx, miniGrid, miniTiles, 12, 8, 48);

    // ────────────────────────────────────────
    // 6. パーティ5人スプライト（scale=2、横一列）
    // ────────────────────────────────────────
    var partyIds    = ['yuito', 'ikuma', 'aoshi', 'tomoki', 'itsuki'];
    var partyNames  = ['ユイト', 'イクマ', 'アオシ', 'トモキ', 'イツキ'];
    var partyColors = ['#ff8888', '#88aaff', '#88dd88', '#ffdd44', '#ffffff'];
    var charY = 118;
    var charSpacing = 46;
    var charStartX  = 8;

    for (var i = 0; i < partyIds.length; i++) {
      var cx = charStartX + i * charSpacing;
      SRPG.drawSprite(ctx, SRPG.SPRITES[partyIds[i]], cx, charY, 2);
      SRPG.drawText(ctx, partyNames[i], cx + 16, charY + 34, {
        size: 9, color: partyColors[i], align: 'center'
      });
    }

    // ────────────────────────────────────────
    // 7. 各キャラの詳細ラベル（ユニフォーム色）
    // ────────────────────────────────────────
    SRPG.drawText(ctx, '主人公 #10', 8 + 16, charY + 44, {
      size: 7, color: '#9b1b3a', align: 'center'
    });
    SRPG.drawText(ctx, 'MF', 8 + charSpacing + 16, charY + 44, {
      size: 7, color: '#1a4dbf', align: 'center'
    });
    SRPG.drawText(ctx, 'DF', 8 + charSpacing*2 + 16, charY + 44, {
      size: 7, color: '#1a8c3a', align: 'center'
    });
    SRPG.drawText(ctx, 'GK', 8 + charSpacing*3 + 16, charY + 44, {
      size: 7, color: '#c0a000', align: 'center'
    });
    SRPG.drawText(ctx, 'FW', 8 + charSpacing*4 + 16, charY + 44, {
      size: 7, color: '#cccccc', align: 'center'
    });

    // ────────────────────────────────────────
    // 8. ドラクエ風メッセージ枠 + テキスト（画面下部）
    // ────────────────────────────────────────
    var winX = 8, winY = 258, winW = 224, winH = 56;
    SRPG.drawWindow(ctx, winX, winY, winW, winH);
    SRPG.drawText(ctx, 'ユイトは ぼうけんに でた！', winX + 12, winY + 10, {
      size: 13, color: '#ffffff'
    });
    SRPG.drawText(ctx, 'なかまを あつめて', winX + 12, winY + 28, {
      size: 13, color: '#cccccc'
    });
    SRPG.drawText(ctx, 'きんのボールを さがせ！', winX + 12, winY + 40, {
      size: 11, color: '#aaaaaa'
    });

    // ────────────────────────────────────────
    // 9. ステータス帯（中段）
    // ────────────────────────────────────────
    SRPG.drawWindow(ctx, 8, 174, 224, 26, { radius: 4 });
    SRPG.drawText(ctx, 'HP ████████  MP ████  Lv.1', 18, 182, {
      size: 10, color: '#88ff88'
    });

    // ────────────────────────────────────────
    // 10. 区切り線
    // ────────────────────────────────────────
    ctx.strokeStyle = '#334466';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(4, 46);
    ctx.lineTo(236, 46);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(4, 112);
    ctx.lineTo(236, 112);
    ctx.stroke();
  }

  draw();

  // リサイズ後に再描画
  window.addEventListener('resize', function () {
    ctx = SRPG.getCtx();
    draw();
  });
})();
</script>
</body>
</html>
