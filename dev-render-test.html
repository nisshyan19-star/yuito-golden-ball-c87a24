<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>描画エンジン目視確認 [dev]</title>
  <style>
    html,body {
      margin: 0;
      height: 100%;
      background: #0b0b12;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
      background: #000;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>

<!-- エンジンファイルを ORDER 順に読み込む -->
<script src="src/data/sprites.js"></script>
<script src="src/engine/canvas.js"></script>
<script src="src/engine/render.js"></script>

<script>
(function () {
  var canvas = document.getElementById('game');
  SRPG.initCanvas(canvas);
  var ctx = SRPG.getCtx();

  function draw() {
    var VW = SRPG.VW;  // 288
    var VH = SRPG.VH;  // 512

    // ── 1. 背景: 縦グラデ（モダン濃紺）──
    var bg = ctx.createLinearGradient(0, 0, 0, VH);
    bg.addColorStop(0, '#20243f');
    bg.addColorStop(1, '#2e3358');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, VW, VH);

    // ── 2. タイトル ──
    SRPG.drawText(ctx, 'ユイトと黄金のサッカーボール', VW / 2, 10, {
      size: 15, color: '#ffd24a', align: 'center', shadow: true, weight: 'bold'
    });

    // ── 3. タイル5種 横並び＋ラベル ──
    var tileKeys   = ['t_grass', 't_road', 't_wall', 't_water', 't_floor'];
    var tileLabels = ['草', '道', '壁', '水', '床'];
    var tileScale  = 2;             // 16px -> 32px
    var tileSize   = 16 * tileScale;
    var tileGap    = 14;
    var tileTotalW = tileKeys.length * tileSize + (tileKeys.length - 1) * tileGap;
    var tileStartX = (VW - tileTotalW) / 2;
    var tileY      = 40;
    for (var t = 0; t < tileKeys.length; t++) {
      var tx = tileStartX + t * (tileSize + tileGap);
      SRPG.drawSprite(ctx, SRPG.SPRITES[tileKeys[t]], tx, tileY, tileScale);
      SRPG.drawText(ctx, tileLabels[t], tx + tileSize / 2, tileY + tileSize + 3, {
        size: 11, color: '#d8def0', align: 'center'
      });
    }

    // ── 4. ミニマップ（地続きに見えるサンプル）──
    var miniGrid = [
      ['g','g','g','r','r','r','g','g','g','g','w','w'],
      ['g','g','r','r','g','r','r','g','g','w','w','a'],
      ['g','r','r','g','g','g','r','r','w','w','a','a'],
      ['g','r','g','g','f','g','g','r','w','a','a','a'],
      ['g','r','r','g','g','g','r','r','w','w','a','a'],
      ['g','g','r','r','r','r','r','g','g','w','w','a'],
    ];
    var miniTiles = {
      'g': SRPG.SPRITES.t_grass,
      'r': SRPG.SPRITES.t_road,
      'w': SRPG.SPRITES.t_wall,
      'a': SRPG.SPRITES.t_water,
      'f': SRPG.SPRITES.t_floor,
    };
    var miniTile = 20;
    var miniW    = miniGrid[0].length * miniTile;
    var miniX    = (VW - miniW) / 2;
    var miniY    = 108;
    SRPG.drawTileMap(ctx, miniGrid, miniTiles, miniTile, miniX, miniY);
    // ミニマップの外枠（控えめ）
    ctx.strokeStyle = 'rgba(94,200,255,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(miniX + 0.5, miniY + 0.5, miniW - 1, miniGrid.length * miniTile - 1);

    // ── 5. パーティ5人（足元に影→キャラ）──
    var partyIds    = ['yuito', 'ikuma', 'aoshi', 'tomoki', 'itsuki'];
    var partyNames  = ['ユイト', 'イクマ', 'アオシ', 'トモキ', 'イツキ'];
    var partyPos    = ['FW #10', 'FW', 'MF', 'DF', 'GK'];
    var partyColors = ['#ff8da0', '#9ab9ff', '#86e0a4', '#ffe27a', '#7fe6df'];
    var charSize    = 32;           // scale=1
    var charGap     = 4;
    var charTotalW  = partyIds.length * charSize + (partyIds.length - 1) * charGap;
    var charStartX  = (VW - charTotalW) / 2;
    var charY       = 244;
    for (var i = 0; i < partyIds.length; i++) {
      var cx = charStartX + i * (charSize + charGap);
      var centerX = cx + charSize / 2;
      // 足元の影（接地）
      SRPG.drawShadow(ctx, centerX, charY + charSize - 2, 13, 4);
      // キャラ本体
      SRPG.drawSprite(ctx, SRPG.SPRITES[partyIds[i]], cx, charY, 1);
      // 名前
      SRPG.drawText(ctx, partyNames[i], centerX, charY + charSize + 4, {
        size: 10, color: partyColors[i], align: 'center', weight: 'bold'
      });
      // ポジション
      SRPG.drawText(ctx, partyPos[i], centerX, charY + charSize + 17, {
        size: 8, color: '#aab2cc', align: 'center'
      });
    }

    // ── 6. HP/MPバー（角丸トラック＋グラデ塗り）＋ Lv.1 ──
    var barX = 16, barY = 318, barW = 168, barH = 12, barGap = 8;
    drawBar(ctx, barX, barY,           barW, barH, 0.82, '#2ee06a', '#1f9d4d', 'HP');
    drawBar(ctx, barX, barY + barH + barGap, barW, barH, 0.65, '#4aa6ff', '#1b59c9', 'MP');
    SRPG.drawText(ctx, 'Lv.1', barX + barW + 14, barY + 9, {
      size: 16, color: '#ffd24a', align: 'left', weight: 'bold', shadow: true
    });

    // ── 7. 下部メッセージパネル ──
    var winX = 16, winW = VW - 32, winH = 84, winY = VH - winH - 16;
    SRPG.drawWindow(ctx, winX, winY, winW, winH);
    SRPG.drawText(ctx, 'ユイトは ぼうけんに でた！', winX + 16, winY + 16, {
      size: 15, color: '#ffffff'
    });
    SRPG.drawText(ctx, 'なかまを あつめて', winX + 16, winY + 40, {
      size: 14, color: '#dfe5f5'
    });
    SRPG.drawText(ctx, 'きんのボールを さがせ！', winX + 16, winY + 60, {
      size: 14, color: '#ffd24a'
    });
  }

  // HP/MP バー描画ヘルパ（このデモ専用）
  function drawBar(ctx, x, y, w, h, ratio, fillA, fillB, label) {
    var r = h / 2;
    // トラック（暗い角丸）
    ctx.fillStyle = 'rgba(8,10,20,0.85)';
    roundRectPath(ctx, x, y, w, h, r);
    ctx.fill();
    // 塗り（グラデ）
    var fw = Math.max(h, Math.round(w * ratio));
    var g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, fillA);
    g.addColorStop(1, fillB);
    ctx.fillStyle = g;
    roundRectPath(ctx, x, y, fw, h, r);
    ctx.fill();
    // 枠
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    roundRectPath(ctx, x + 0.5, y + 0.5, w - 1, h - 1, r);
    ctx.stroke();
    // ラベル
    SRPG.drawText(ctx, label, x + 6, y + (h - 9) / 2, {
      size: 9, color: '#ffffff', weight: 'bold'
    });
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); }
    else { ctx.rect(x, y, w, h); }
  }

  draw();

  // リサイズ後に再描画
  window.addEventListener('resize', function () {
    ctx = SRPG.getCtx();
    draw();
  });
})();
</script>
</body>
</html>
