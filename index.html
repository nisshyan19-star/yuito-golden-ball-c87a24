function makeRng(seed) {
  let s = (seed >>> 0) || 1;
  function next() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next,
    rangeInt: (min, max) => min + Math.floor(next() * (max - min + 1)),
    chance: (p) => next() < p,
    pick: (arr) => arr[Math.floor(next() * arr.length)],
  };
}

const SKILLS = (typeof require !== 'undefined')
  ? require('../data/skills.js').SKILLS
  : (typeof window !== 'undefined' && window.SRPG && window.SRPG.SKILLS);

/**
 * 次のレベルに必要な経験値
 * @param {number} level
 * @returns {number}
 */
function expForNextLevel(level) {
  return Math.floor(8 * Math.pow(level, 1.6)) + level * 4;
}

/**
 * 経験値を加算し、レベルアップ・能力上昇・技習得を適用する
 * @param {object} character - キャラクターオブジェクト（直接書き換える）
 * @param {number} amount - 加算する経験値
 * @returns {{ leveledUp: boolean, learned: string[] }}
 */
function gainExp(character, amount) {
  let leveledUp = false;
  const learned = [];

  character.exp += amount;

  while (character.exp >= expForNextLevel(character.level)) {
    character.exp -= expForNextLevel(character.level);
    character.level += 1;
    character.maxHp  += character.growth.hp;
    character.maxMp  += character.growth.mp;
    character.atk    += character.growth.atk;
    character.def    += character.growth.def;
    character.spd    += character.growth.spd;
    // レベルアップ時全回復
    character.hp = character.maxHp;
    character.mp = character.maxMp;
    leveledUp = true;
  }

  // 技習得判定（レベルアップが1回でも発生した場合）
  if (leveledUp) {
    for (const skill of Object.values(SKILLS)) {
      if (
        skill.user === character.id &&
        skill.learnLevel != null &&
        skill.learnLevel <= character.level &&
        !character.skills.includes(skill.id)
      ) {
        character.skills.push(skill.id);
        learned.push(skill.id);
      }
    }
  }

  return { leveledUp, learned };
}

const ITEMS = (typeof require !== 'undefined')

/**
 * useItem(target, item)
 * 道具を target に使い効果をその場で適用する。
 * @returns {{ ok: boolean, message: string }}
 */
function useItem(target, item) {
  const eff = item.effect || {};
  let applied = false;

  // 復活アイテム
  if ('revive' in eff) {
    if (!target.dead) {
      return { ok: false, message: 'まだ たおれていない' };
    }
    target.dead = false;
    target.hp = Math.max(1, Math.floor(target.maxHp * eff.revive));
    return { ok: true, message: 'たちあがった！' };
  }

  // HP / MP 回復（戦闘不能には使えない）
  if ('hp' in eff || 'mp' in eff) {
    if (target.dead) {
      return { ok: false, message: 'たおれていて つかえない' };
    }
    if ('hp' in eff) {
      target.hp = Math.min(target.maxHp, target.hp + eff.hp);
      applied = true;
    }
    if ('mp' in eff) {
      target.mp = Math.min(target.maxMp, target.mp + eff.mp);
      applied = true;
    }
    if (applied) {
      // HP と MP 両方持つ場合も含め、どちらか効けば ok:true
      if ('hp' in eff && !('mp' in eff)) {
        return { ok: true, message: 'HPが かいふくした！' };
      }
      if ('mp' in eff && !('hp' in eff)) {
        return { ok: true, message: 'スタミナが かいふくした！' };
      }
      // 両方
      return { ok: true, message: 'HPが かいふくした！' };
    }
  }

  return { ok: false, message: 'なにも おきなかった' };
}

/**
 * applyEquip(character)
 * 装備の atk/def を反映した実効値を返す（非破壊）。
 * @returns {{ atk: number, def: number }}
 */
function applyEquip(character) {
  const weaponId = character.equip && character.equip.weapon;
  const armorId  = character.equip && character.equip.armor;

  const weaponAtk = (weaponId && ITEMS && ITEMS[weaponId]) ? ITEMS[weaponId].atk : 0;
  const armorDef  = (armorId  && ITEMS && ITEMS[armorId])  ? ITEMS[armorId].def  : 0;

  return {
    atk: character.atk + (weaponAtk || 0),
    def: character.def + (armorDef  || 0),
  };
}

/**
 * battle.js — 戦闘ダメージ計算コア
 * calcDamage / applyDamage / isDefeated
 */

/**
 * ダメージを計算して返す。
 * @param {{ atk: number }} attacker
 * @param {{ def: number }} defender
 * @param {{ power?: number, rng?: object, crit?: boolean }} [opts]
 * @returns {number} ダメージ値（1以上）
 */
function calcDamage(attacker, defender, opts) {
  var power   = (opts && opts.power != null) ? opts.power : 1;
  var rng     = (opts && opts.rng)  ? opts.rng  : null;
  var critOpt = (opts && opts.crit != null) ? opts.crit : null;

  var base = attacker.atk - defender.def / 2;

  // 乱数の呼び出し順序を固定: 先に variance、次に crit
  var variance = (rng != null) ? (0.9 + 0.2 * rng.next()) : 0.5 + 0.9; // rng無し→中央値1.0相当
  // ※ rng無しの場合 variance = 0.9 + 0.2 * 0.5 = 1.0（中央値）
  if (rng == null) {
    variance = 0.9 + 0.2 * 0.5; // 1.0
  }

  var dmg = Math.max(1, Math.round(base * power * variance));

  // クリティカル判定（乱数呼び出し順: varianceの後）
  var isCrit;
  if (critOpt !== null && critOpt !== undefined) {
    isCrit = !!critOpt;
  } else if (rng != null) {
    isCrit = rng.chance(0.08);
  } else {
    isCrit = false;
  }

  if (isCrit) {
    dmg = Math.max(1, dmg * 2);
  }

  return dmg;
}

/**
 * ダメージをユニットに適用する。
 * @param {{ hp: number, dead: boolean }} target
 * @param {number} dmg
 * @returns {number} 適用後の hp
 */
function applyDamage(target, dmg) {
  target.hp = Math.max(0, target.hp - dmg);
  if (target.hp === 0) {
    target.dead = true;
  }
  return target.hp;
}

/**
 * ユニットが倒されているか判定する。
 * @param {{ hp: number, dead: boolean }} unit
 * @returns {boolean}
 */
function isDefeated(unit) {
  return unit.hp <= 0 || unit.dead === true;
}

// === src/logic/ally-ai.js ===
const SKILLS = (typeof require !== 'undefined')
  ? require('../data/skills.js').SKILLS
  : (typeof window !== 'undefined' && window.SRPG && window.SRPG.SKILLS);

// ヘルパ関数
function isDead(u) {
  return u.dead === true || u.hp <= 0;
}

function ratio(u) {
  if (!u.maxHp || u.maxHp === 0) return 1;
  return u.hp / u.maxHp;
}

/**
 * おまかせAI: 仲間キャラクターの行動を決定する
 * @param {object} actor - 行動するキャラクター
 * @param {object[]} party - 味方全員（actor含む）
 * @param {object[]} enemies - 敵全員
 * @param {object} rng - 乱数生成器（シグネチャ維持用）
 * @returns {{ type:'attack'|'skill'|'cover', skillId?, targetId? }}
 */
function chooseAllyAction(actor, party, enemies, rng) {
  const aliveEnemies = enemies.filter(e => !isDead(e));
  const aliveAllies = party.filter(p => !isDead(p));
  const mySkills = actor.skills.map(id => SKILLS[id]).filter(Boolean);

  function canUse(s) {
    return s && actor.mp >= s.mp;
  }

  // 1. 回復役（heal技を所持）
  const healSkills = mySkills.filter(s => s.type === 'heal');
  if (healSkills.length > 0) {
    const dyingAllies = aliveAllies.filter(a => ratio(a) <= 0.35);

    // 瀕死が2人以上かつ全体回復が使える
    if (dyingAllies.length >= 2) {
      const aoeHeal = healSkills.find(s => s.target === 'allies' && canUse(s));
      if (aoeHeal) {
        return { type: 'skill', skillId: aoeHeal.id };
      }
    }

    // 瀕死が1人以上かつ単体回復が使える
    if (dyingAllies.length >= 1) {
      const singleHeal = healSkills.find(s => s.target === 'ally' && canUse(s));
      if (singleHeal) {
        // 最も ratio の低い瀕死味方を対象に
        const target = dyingAllies.reduce((a, b) => ratio(a) <= ratio(b) ? a : b);
        return { type: 'skill', skillId: singleHeal.id, targetId: target.id };
      }
    }
    // 瀕死がいない／MP不足なら次へフォールスルー
  }

  // 2. かばう役（cover技を所持）
  const coverSkills = mySkills.filter(s => s.type === 'cover');
  if (coverSkills.length > 0) {
    const dyingOthers = aliveAllies.filter(a => a.id !== actor.id && ratio(a) <= 0.35);
    if (dyingOthers.length > 0) {
      const coverSkill = coverSkills[0];
      const target = dyingOthers.reduce((a, b) => ratio(a) <= ratio(b) ? a : b);
      return { type: 'cover', skillId: coverSkill.id, targetId: target.id };
    }
  }

  // 3. 全体攻撃 & 敵2体以上
  const aoeAttack = mySkills.find(s => s.type === 'attack' && s.target === 'all' && canUse(s));
  if (aoeAttack && aliveEnemies.length >= 2) {
    return { type: 'skill', skillId: aoeAttack.id };
  }

  // 4. 単体必殺技（power高い順） & MP足りる
  const oneAttacks = mySkills
    .filter(s => s.type === 'attack' && s.target === 'one' && canUse(s))
    .sort((a, b) => (b.power || 0) - (a.power || 0));
  if (oneAttacks.length > 0 && aliveEnemies.length > 0) {
    const best = oneAttacks[0];
    const target = aliveEnemies.reduce((a, b) => a.hp <= b.hp ? a : b);
    return { type: 'skill', skillId: best.id, targetId: target.id };
  }

  // 5. 通常攻撃：最も hp の低い生存敵を狙う
  if (aliveEnemies.length > 0) {
    const target = aliveEnemies.reduce((a, b) => a.hp <= b.hp ? a : b);
    return { type: 'attack', targetId: target.id };
  }

  // 6. 生存敵がいない保険
  return { type: 'attack', targetId: null };
}

const SAVE_VERSION = 1;

function serialize(gameState) {
  return JSON.stringify({ version: SAVE_VERSION, data: gameState });
}

function deserialize(str) {
  try {
    const obj = JSON.parse(str);
    if (obj === null || typeof obj !== 'object') return null;
    if (!('data' in obj)) return null;
    return obj.data;
  } catch (e) {
    return null;
  }
}
