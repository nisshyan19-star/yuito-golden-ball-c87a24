// === src/core/rng.js ===
function makeRng(seed) {
  let s = (seed >>> 0) || 1;
  function next() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next,
    rangeInt: (min, max) => min + Math.floor(next() * (max - min + 1)),
    chance: (p) => next() < p,
    pick: (arr) => arr[Math.floor(next() * arr.length)],
  };
}

// CHARACTERS は遅延解決する。ブラウザでは <script> の読み込み順に依存せず、
// 実際に呼ばれた時点で window.SRPG.CHARACTERS を参照する（characters.js が後でも安全）。
function _characters() {
  if (typeof require !== 'undefined') return require('../data/characters.js').CHARACTERS;
  return (typeof window !== 'undefined' && window.SRPG && window.SRPG.CHARACTERS) || {};
}

function createCharacter(id) {
  const def = _characters()[id];
  if (!def) throw new Error('Unknown character id: ' + id);
  return {
    id:       def.id,
    name:     def.name,
    position: def.position,
    level:    1,
    exp:      0,
    maxHp:    def.base.hp,
    hp:       def.base.hp,
    maxMp:    def.base.mp,
    mp:       def.base.mp,
    atk:      def.base.atk,
    def:      def.base.def,
    spd:      def.base.spd,
    skills:   [...def.skills],
    growth:   { ...def.growth },
    equip:    { weapon: null, armor: null },
    dead:     false,
  };
}

function createNewGame() {
  return {
    party:    [createCharacter('yuito')],
    inventory:{ drink: 2 },
    gold:     0,
    flags:    {},
    position: { map: 'field1', x: 5, y: 5 },
    settings: { autoAllies: true },
  };
}

function cloneState(s) {
  return structuredClone(s);
}

const SKILLS = (typeof require !== 'undefined')

/**
 * 次のレベルに必要な経験値
 * @param {number} level
 * @returns {number}
 */
function expForNextLevel(level) {
  return Math.floor(8 * Math.pow(level, 1.6)) + level * 4;
}

/**
 * 経験値を加算し、レベルアップ・能力上昇・技習得を適用する
 * @param {object} character - キャラクターオブジェクト（直接書き換える）
 * @param {number} amount - 加算する経験値
 * @returns {{ leveledUp: boolean, learned: string[] }}
 */
function gainExp(character, amount) {
  let leveledUp = false;
  const learned = [];

  character.exp += amount;

  while (character.exp >= expForNextLevel(character.level)) {
    character.exp -= expForNextLevel(character.level);
    character.level += 1;
    character.maxHp  += character.growth.hp;
    character.maxMp  += character.growth.mp;
    character.atk    += character.growth.atk;
    character.def    += character.growth.def;
    character.spd    += character.growth.spd;
    // レベルアップ時全回復
    character.hp = character.maxHp;
    character.mp = character.maxMp;
    leveledUp = true;
  }

  // 技習得判定（レベルアップが1回でも発生した場合）
  if (leveledUp) {
    for (const skill of Object.values(SKILLS)) {
      if (
        skill.user === character.id &&
        skill.learnLevel != null &&
        skill.learnLevel <= character.level &&
        !character.skills.includes(skill.id)
      ) {
        character.skills.push(skill.id);
        learned.push(skill.id);
      }
    }
  }

  return { leveledUp, learned };
}

/**
 * useItem(target, item)
 * 道具を target に使い効果をその場で適用する。
 * @returns {{ ok: boolean, message: string }}
 */
function useItem(target, item) {
  const eff = item.effect || {};
  let applied = false;

  // 復活アイテム
  if ('revive' in eff) {
    if (!target.dead) {
      return { ok: false, message: 'まだ たおれていない' };
    }
    target.dead = false;
    target.hp = Math.max(1, Math.floor(target.maxHp * eff.revive));
    return { ok: true, message: 'たちあがった！' };
  }

  // HP / MP 回復（戦闘不能には使えない）
  if ('hp' in eff || 'mp' in eff) {
    if (target.dead) {
      return { ok: false, message: 'たおれていて つかえない' };
    }
    if ('hp' in eff) {
      target.hp = Math.min(target.maxHp, target.hp + eff.hp);
      applied = true;
    }
    if ('mp' in eff) {
      target.mp = Math.min(target.maxMp, target.mp + eff.mp);
      applied = true;
    }
    if (applied) {
      // HP と MP 両方持つ場合も含め、どちらか効けば ok:true
      if ('hp' in eff && !('mp' in eff)) {
        return { ok: true, message: 'HPが かいふくした！' };
      }
      if ('mp' in eff && !('hp' in eff)) {
        return { ok: true, message: 'スタミナが かいふくした！' };
      }
      // 両方
      return { ok: true, message: 'HPが かいふくした！' };
    }
  }

  return { ok: false, message: 'なにも おきなかった' };
}

/**
 * battle.js — 戦闘ダメージ計算コア
 * calcDamage / applyDamage / isDefeated
 */

/**
 * ダメージを計算して返す。
 * @param {{ atk: number }} attacker
 * @param {{ def: number }} defender
 * @param {{ power?: number, rng?: object, crit?: boolean }} [opts]
 * @returns {number} ダメージ値（1以上）
 */
function calcDamage(attacker, defender, opts) {
  var power   = (opts && opts.power != null) ? opts.power : 1;
  var rng     = (opts && opts.rng)  ? opts.rng  : null;
  var critOpt = (opts && opts.crit != null) ? opts.crit : null;

  var base = attacker.atk - defender.def / 2;

  // 乱数の呼び出し順序を固定: 先に variance、次に crit
  var variance = (rng != null) ? (0.9 + 0.2 * rng.next()) : 0.5 + 0.9; // rng無し→中央値1.0相当
  // ※ rng無しの場合 variance = 0.9 + 0.2 * 0.5 = 1.0（中央値）
  if (rng == null) {
    variance = 0.9 + 0.2 * 0.5; // 1.0
  }

  var dmg = Math.max(1, Math.round(base * power * variance));

  // クリティカル判定（乱数呼び出し順: varianceの後）
  var isCrit;
  if (critOpt !== null && critOpt !== undefined) {
    isCrit = !!critOpt;
  } else if (rng != null) {
    isCrit = rng.chance(0.08);
  } else {
    isCrit = false;
  }

  if (isCrit) {
    dmg = Math.max(1, dmg * 2);
  }

  return dmg;
}

/**
 * ダメージをユニットに適用する。
 * @param {{ hp: number, dead: boolean }} target
 * @param {number} dmg
 * @returns {number} 適用後の hp
 */
function applyDamage(target, dmg) {
  target.hp = Math.max(0, target.hp - dmg);
  if (target.hp === 0) {
    target.dead = true;
  }
  return target.hp;
}

/**
 * ユニットが倒されているか判定する。
 * @param {{ hp: number, dead: boolean }} unit
 * @returns {boolean}
 */
function isDefeated(unit) {
  return unit.hp <= 0 || unit.dead === true;
}

const SKILLS = (typeof require !== 'undefined')
  ? require('../data/skills.js').SKILLS
  : (typeof window !== 'undefined' && window.SRPG && window.SRPG.SKILLS);

// ヘルパ関数
function isDead(u) {
  return u.dead === true || u.hp <= 0;
}

function ratio(u) {
  if (!u.maxHp || u.maxHp === 0) return 1;
  return u.hp / u.maxHp;
}

/**
 * おまかせAI: 仲間キャラクターの行動を決定する
 * @param {object} actor - 行動するキャラクター
 * @param {object[]} party - 味方全員（actor含む）
 * @param {object[]} enemies - 敵全員
 * @param {object} rng - 乱数生成器（シグネチャ維持用）
 * @returns {{ type:'attack'|'skill'|'cover', skillId?, targetId? }}
 */
function chooseAllyAction(actor, party, enemies, rng) {
  const aliveEnemies = enemies.filter(e => !isDead(e));
  const aliveAllies = party.filter(p => !isDead(p));
  const mySkills = actor.skills.map(id => SKILLS[id]).filter(Boolean);

  function canUse(s) {
    return s && actor.mp >= s.mp;
  }

  // 1. 回復役（heal技を所持）
  const healSkills = mySkills.filter(s => s.type === 'heal');
  if (healSkills.length > 0) {
    const dyingAllies = aliveAllies.filter(a => ratio(a) <= 0.35);

    // 瀕死が2人以上かつ全体回復が使える
    if (dyingAllies.length >= 2) {
      const aoeHeal = healSkills.find(s => s.target === 'allies' && canUse(s));
      if (aoeHeal) {
        return { type: 'skill', skillId: aoeHeal.id };
      }
    }

    // 瀕死が1人以上かつ単体回復が使える
    if (dyingAllies.length >= 1) {
      const singleHeal = healSkills.find(s => s.target === 'ally' && canUse(s));
      if (singleHeal) {
        // 最も ratio の低い瀕死味方を対象に
        const target = dyingAllies.reduce((a, b) => ratio(a) <= ratio(b) ? a : b);
        return { type: 'skill', skillId: singleHeal.id, targetId: target.id };
      }
    }
    // 瀕死がいない／MP不足なら次へフォールスルー
  }

  // 2. かばう役（cover技を所持）
  const coverSkills = mySkills.filter(s => s.type === 'cover');
  if (coverSkills.length > 0) {
    const dyingOthers = aliveAllies.filter(a => a.id !== actor.id && ratio(a) <= 0.35);
    if (dyingOthers.length > 0) {
      const coverSkill = coverSkills[0];
      const target = dyingOthers.reduce((a, b) => ratio(a) <= ratio(b) ? a : b);
      return { type: 'cover', skillId: coverSkill.id, targetId: target.id };
    }
  }

  // 3. 全体攻撃 & 敵2体以上
  const aoeAttack = mySkills.find(s => s.type === 'attack' && s.target === 'all' && canUse(s));
  if (aoeAttack && aliveEnemies.length >= 2) {
    return { type: 'skill', skillId: aoeAttack.id };
  }

  // 4. 単体必殺技（power高い順） & MP足りる
  const oneAttacks = mySkills
    .filter(s => s.type === 'attack' && s.target === 'one' && canUse(s))
    .sort((a, b) => (b.power || 0) - (a.power || 0));
  if (oneAttacks.length > 0 && aliveEnemies.length > 0) {
    const best = oneAttacks[0];
    const target = aliveEnemies.reduce((a, b) => a.hp <= b.hp ? a : b);
    return { type: 'skill', skillId: best.id, targetId: target.id };
  }

  // 5. 通常攻撃：最も hp の低い生存敵を狙う
  if (aliveEnemies.length > 0) {
    const target = aliveEnemies.reduce((a, b) => a.hp <= b.hp ? a : b);
    return { type: 'attack', targetId: target.id };
  }

  // 6. 生存敵がいない保険
  return { type: 'attack', targetId: null };
}

/**
 * drawSprite: スプライトを描画する
 * @param {CanvasRenderingContext2D} ctx
 * @param {Object} sprite  { map: string[], palette: Object }
 * @param {number} x       左上X（仮想座標）
 * @param {number} y       左上Y（仮想座標）
 * @param {number} [scale] 1ピクセル=何仮想px か（デフォルト1）
 */
function drawSprite(ctx, sprite, x, y, scale) {
  if (!sprite || !sprite.map) return;
  scale = scale || 1;
  var map = sprite.map;
  var palette = sprite.palette;
  for (var row = 0; row < map.length; row++) {
    var line = map[row];
    for (var col = 0; col < line.length; col++) {
      var ch = line[col];
      if (ch === '.' || ch === ' ') continue;
      var color = palette[ch];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(x + col * scale, y + row * scale, scale, scale);
    }
  }
}

/**
 * drawTileMap: タイルマップを描画する
 * @param {CanvasRenderingContext2D} ctx
 * @param {string[][]} grid       2次元配列（各文字が tileSprites のキー）
 * @param {Object} tileSprites    { key: sprite, ... }
 * @param {number} tileSize       タイルの仮想px（スプライトは16px前提）
 * @param {number} offsetX
 * @param {number} offsetY
 */
function drawTileMap(ctx, grid, tileSprites, tileSize, offsetX, offsetY) {
  var scale = tileSize / 16;
  for (var r = 0; r < grid.length; r++) {
    for (var c = 0; c < grid[r].length; c++) {
      var key = grid[r][c];
      var sp = tileSprites[key];
      if (!sp) continue;
      drawSprite(ctx, sp, offsetX + c * tileSize, offsetY + r * tileSize, scale);
    }
  }
}

  ctx.fillText(str, x, y);

/**
 * drawShadow: キャラ足元の楕円影（接地感）
 * @param {CanvasRenderingContext2D} ctx
 * @param {number} cx  中心X
 * @param {number} cy  中心Y
 * @param {number} rx  横半径
 * @param {number} ry  縦半径

function drawShadow(ctx, cx, cy, rx, ry) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  if (ctx.ellipse) {
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  } else {

    ctx.translate(cx, cy);
    ctx.scale(1, ry / rx);
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
  }
  ctx.fill();
  ctx.restore();
}

/**
 * _rectPath: 角丸（roundRect 非対応環境は通常矩形）でパスを切る内部ヘルパ
 */

  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, radius);
  } else {
    ctx.rect(x, y, w, h);
  }
}

/**
 * drawWindow: 今風のパネル枠を描画する
 *  - ドロップシャドウ / 縦グラデ本体 / アクセント枠線 / 上辺ハイライト
 * @param {CanvasRenderingContext2D} ctx
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} h

  opts = opts || {};
  var radius = (opts.radius !== undefined) ? opts.radius : 10;

  // 1. ドロップシャドウ（本体より +3px 右下）
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  _rectPath(ctx, x + 3, y + 3, w, h, radius);
  ctx.fill();

  // 2. 本体塗り（opts.fill があればベタ、無ければ縦グラデ）
  if (opts.fill) {
    ctx.fillStyle = opts.fill;
  } else {
    var grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, 'rgba(30,34,58,0.95)');
    grad.addColorStop(1, 'rgba(16,18,34,0.97)');
    ctx.fillStyle = grad;
  }
  _rectPath(ctx, x, y, w, h, radius);
  ctx.fill();

  // 3. 枠線（2px アクセント色）
  ctx.strokeStyle = border;
  ctx.lineWidth   = 2;
  _rectPath(ctx, x, y, w, h, radius);
  ctx.stroke();

  // 4. 上辺内側の 1px ハイライト
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(x + radius, y + 1.5);
  ctx.lineTo(x + w - radius, y + 1.5);
  ctx.stroke();

  ctx.restore();
}

  down:  { type: 'rect', x: DPAD_CX - DPAD_BTN / 2,         y: DPAD_CY + DPAD_BTN / 2,   w: DPAD_BTN, h: DPAD_BTN },
  left:  { type: 'rect', x: DPAD_CX - DPAD_BTN * 1.5,       y: DPAD_CY - DPAD_BTN / 2,   w: DPAD_BTN, h: DPAD_BTN },
  right: { type: 'rect', x: DPAD_CX + DPAD_BTN / 2,         y: DPAD_CY - DPAD_BTN / 2,   w: DPAD_BTN, h: DPAD_BTN },

function _blankState() {

  _held.cancel = _touchHeld.cancel || _keyHeld.cancel;

// クライアント座標 → 仮想座標（0..VW × 0..VH）
function _toVirtual(clientX, clientY) {

  if (!rect.width || !rect.height) return { x: -1, y: -1 };
  return {
    x: (clientX - rect.left) * (VW / rect.width),
    y: (clientY - rect.top) * (VH / rect.height),

// 仮想座標がどのボタンに当たるか（複数当たれば最初の一つ）
function _hitButton(vx, vy) {
  for (var key in BTN_DEFS) {
    if (!Object.prototype.hasOwnProperty.call(BTN_DEFS, key)) continue;
    var b = BTN_DEFS[key];
    if (b.type === 'rect') {
      if (vx >= b.x && vx <= b.x + b.w && vy >= b.y && vy <= b.y + b.h) return key;
    } else {
      var dx = vx - b.cx;
      var dy = vy - b.cy;
      if (dx * dx + dy * dy <= b.r * b.r) return key;
    }

// 全タッチ点を見て _touchHeld を作り直す（複数指の簡易対応）
function _updateTouches(touchList) {

    var v = _toVirtual(t.clientX, t.clientY);
    var key = _hitButton(v.x, v.y);
    if (key) next[key] = true;

  _touchHeld = next;
  _mergeHeld();
}

function _onTouch(e) {
  if (e.preventDefault) e.preventDefault();
  _updateTouches(e.touches || []);
}

function _keyToInput(key) {
  switch (key) {
    case 'ArrowUp': case 'Up': return 'up';
    case 'ArrowDown': case 'Down': return 'down';
    case 'ArrowLeft': case 'Left': return 'left';
    case 'ArrowRight': case 'Right': return 'right';
    case 'Enter': case ' ': case 'Spacebar': return 'confirm';
    case 'Escape': case 'Esc': case 'Backspace': return 'cancel';
    default: return null;

function _onKeyDown(e) {

  if (!k) return;
  if (e.preventDefault) e.preventDefault();
  _keyHeld[k] = true;
  _mergeHeld();
}

function _onKeyUp(e) {

  if (!k) return;
  _keyHeld[k] = false;
  _mergeHeld();
}

function initInput(canvasEl) {

    canvasEl.addEventListener('touchcancel', _onTouch, opts);

  window.addEventListener('keyup', _onKeyUp);

// メインループから毎フレーム呼ぶ。{held, pressed} を返す。

function pollInput() {

    up: _held.up && !_prevHeld.up,
    down: _held.down && !_prevHeld.down,
    left: _held.left && !_prevHeld.left,
    right: _held.right && !_prevHeld.right,
    confirm: _held.confirm && !_prevHeld.confirm,
    cancel: _held.cancel && !_prevHeld.cancel,
  };
  var held = {
    up: _held.up, down: _held.down, left: _held.left,
    right: _held.right, confirm: _held.confirm, cancel: _held.cancel,
  };
  // 次フレームのエッジ算出のため前フレーム状態を更新
  _prevHeld = {
    up: _held.up, down: _held.down, left: _held.left,
    right: _held.right, confirm: _held.confirm, cancel: _held.cancel,
  };
  return { held: held, pressed: pressed };
}

// --- 描画 ---
function _drawDirButton(ctx, key, label) {
  var b = BTN_DEFS[key];
  var active = _held[key];
  var fill = active ? 'rgba(94,200,255,0.55)' : 'rgba(40,46,72,0.85)';
  var border = active ? '#bff0ff' : '#5ec8ff';
  ctx.save();
  ctx.fillStyle = fill;
  ctx.strokeStyle = border;
  ctx.lineWidth = 2;
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 10);
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }
  // 矢印グリフ
  ctx.fillStyle = active ? '#0b0b12' : '#dff4ff';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.restore();
}

function _drawActButton(ctx, key) {
  var b = BTN_DEFS[key];
  var active = _held[key];
  var base = key === 'confirm' ? '#4caf50' : '#e0556b';
  var hi = key === 'confirm' ? '#a5ffb0' : '#ffb3c0';
  ctx.save();
  ctx.beginPath();
  ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2);
  ctx.fillStyle = active ? hi : base;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.stroke();
  ctx.fillStyle = active ? '#0b0b12' : '#ffffff';
  ctx.font = '11px "Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.cx, b.cy + 1);
  ctx.restore();
}

// 仮想座標で画面下部に十字キー＋決定/キャンセルを描画。押下中はハイライト。
function drawPad(ctx) {
  if (!ctx) return;
  _drawDirButton(ctx, 'up', '▲');
  _drawDirButton(ctx, 'down', '▼');
  _drawDirButton(ctx, 'left', '◀');
  _drawDirButton(ctx, 'right', '▶');
  _drawActButton(ctx, 'confirm');
  _drawActButton(ctx, 'cancel');

  if (typeof scene.onEnter === 'function') scene.onEnter();

function popScene() {
  var scene = _stack.pop();
  if (scene && typeof scene.onExit === 'function') scene.onExit();
  return scene || null;
}

function replaceScene(scene) {
  popScene();
  pushScene(scene);
}

function currentScene() {
  return _stack.length ? _stack[_stack.length - 1] : null;
}

  if (top && typeof top.update === 'function') top.update(dt, input);

  var start = _stack.length - 1;
  while (start > 0 && _stack[start].transparent) start--;
  for (var i = start; i < _stack.length; i++) {
    var s = _stack[i];
    if (s && typeof s.draw === 'function') s.draw(ctx);
  }

// メッセージウィンドウ（タイプライター文字送り・ページ送り対応のモーダルシーン）。

// ── 純粋ロジック（テスト対象） ──────────────────────────────────────

/**
 * wrapText: 文字列を最大文字数で折り返す。
 * '\n' で先に分割し、各行を maxCharsPerLine 文字で詰める。
 * @param {string} str
 * @param {number} maxCharsPerLine
 * @returns {string[]}
 */
function wrapText(str, maxCharsPerLine) {
  var lines = str.split('\n');
  var result = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.length === 0) {
      result.push('');
      continue;
    }
    var pos = 0;
    while (pos < line.length) {
      result.push(line.slice(pos, pos + maxCharsPerLine));
      pos += maxCharsPerLine;
    }
  }
  return result;
}

/**
 * DialogState: dialog の純粋ロジック状態。draw 不要な部分だけを分離。
 * update(dt, pressedConfirm) → { done: bool, changed: bool }
 */
function createDialogState(pages) {
  var _pages       = pages || [''];
  var _pageIndex   = 0;       // 現在のページ番号
  var _charIndex   = 0;       // 表示済み文字数（現在ページ内）
  var _elapsed     = 0;       // 文字送り用タイマー
  var _done        = false;
  var CHARS_PER_SEC = 45;     // 文字送り速度

  function _currentPage() { return _pages[_pageIndex] || ''; }
  function _isLastPage()  { return _pageIndex >= _pages.length - 1; }
  function _isFullyShown(){ return _charIndex >= _currentPage().length; }

  function update(dt, pressedConfirm) {
    if (_done) return { done: true, changed: false };

    // 文字送り（確定押されていない間）
    if (!pressedConfirm) {
      _elapsed += dt;
      var newChars = Math.floor(_elapsed * CHARS_PER_SEC);
      if (newChars > _charIndex) {
        _charIndex = Math.min(newChars, _currentPage().length);
      }
      return { done: false, changed: false };
    }

    // confirm が押された
    if (!_isFullyShown()) {
      // 送り途中 → 全部表示
      _charIndex = _currentPage().length;
      return { done: false, changed: false };
    }

    // 全部表示済み → 次ページへ or 完了
    if (!_isLastPage()) {
      _pageIndex++;
      _charIndex = 0;
      _elapsed   = 0;
      return { done: false, changed: true };
    }

    // 最終ページで confirm → 完了
    _done = true;
    return { done: true, changed: false };
  }

  function getVisibleText() {
    return _currentPage().slice(0, _charIndex);
  }

  function isDone() { return _done; }
  function isPageComplete() { return _isFullyShown(); }

  return {
    update: update,
    getVisibleText: getVisibleText,
    isDone: isDone,
    isPageComplete: isPageComplete,
  };
}

// ── シーンファクトリ ────────────────────────────────────────────────

/**
 * createDialog: メッセージウィンドウシーンを生成して返す。
 * @param {string[]} pages   1要素＝1ページの本文（'\n' 含んでよい）
 * @param {Object}  [opts]   { onComplete: function }
 * @returns シーンオブジェクト { transparent, update, draw, isDone }
 */
function createDialog(pages, opts) {
  opts = opts || {};
  var state   = createDialogState(pages);
  var _popped = false;

  // ウィンドウの仮想座標（仮想解像度 288×512）
  // 仮想パッド（input.js）は画面下部 y≈357〜507 を占有するため、
  // メッセージ窓はその上に収める。winY = VH - 287 = 225、窓底 345 でパッド上端 357 と衝突しない。
  var WIN_X = 12;
  var WIN_Y_OFFSET = 287; // VH - この値（パッドの上に窓を置く）
  var WIN_W = 264;        // VW - 24
  var WIN_H = 120;
  var PAD_X = 12;         // ウィンドウ内パディング
  var PAD_Y = 10;
  var FONT_SIZE = 14;
  var LINE_H   = 20;
  var MAX_CHARS_PER_LINE = 17; // 264px ÷ 約14px/字（日本語等幅換算）

  return {
    transparent: true,

    update: function (dt, input) {
      if (_popped) return;
      var result = state.update(dt, !!(input && input.pressed && input.pressed.confirm));
      if (result.done && !_popped) {
        _popped = true;
        // 先に pop、その後 onComplete（onComplete が push しても破綻しない）
        if (typeof window !== 'undefined' && window.SRPG && typeof window.SRPG.popScene === 'function') {
          window.SRPG.popScene();
        }
        if (typeof opts.onComplete === 'function') opts.onComplete();
      }
    },

    draw: function (ctx) {
      var S = (typeof window !== 'undefined') ? window.SRPG : null;
      if (!S) return;
      var VH = S.VH;
      var winY = VH - WIN_Y_OFFSET;

      // ウィンドウ枠
      S.drawWindow(ctx, WIN_X, winY, WIN_W, WIN_H, {
        radius: 8,
        border: '#5ec8ff',
      });

      // テキスト折り返し・描画
      var visible = state.getVisibleText();
      var wrapped = wrapText(visible, MAX_CHARS_PER_LINE);
      for (var i = 0; i < wrapped.length; i++) {
        S.drawText(ctx, wrapped[i], WIN_X + PAD_X, winY + PAD_Y + i * LINE_H, {
          size: FONT_SIZE,
          color: '#dff4ff',
        });
      }

      // ページ送り促進インジケーター（▼）― 現在ページを全文表示済みかつ未完了のとき右下に点滅
      if (state.isPageComplete() && !state.isDone()) {
        var blink = Math.floor(Date.now() / 400) % 2 === 0;
        if (blink) {
          S.drawText(ctx, '▼', WIN_X + WIN_W - PAD_X - 12, winY + WIN_H - 18, {
            size: 12,
            color: '#5ec8ff',
          });
        }
      }
    },

    isDone: function () { return state.isDone(); },

    // テスト用: 内部 state を公開（Node テストのみ利用）
    _state: state,
  };
}

            }
          ));

        } else if (_cursor === 1) {
          // つづきから
          var saved = S.loadGame();
          if (saved) {
            _startGame(saved);
          }
        }
      }
    },

    draw: function (ctx) {
      var S = (typeof window !== 'undefined') ? window.SRPG : null;
      if (!S) return;
      var VW = S.VW;
      var VH = S.VH;

      // ── 背景（濃紺グラデ） ─────────────────────────────────────────
      var grad = ctx.createLinearGradient(0, 0, 0, VH);
      grad.addColorStop(0, '#0a0e1c');
      grad.addColorStop(1, '#0e1830');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, VW, VH);

      // ── 星の装飾（シンプルドット） ────────────────────────────────
      // 固定シードで擬似ランダムな星を描く（毎フレーム同じ位置）
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      var stars = [
        [30,20],[80,40],[150,15],[220,35],[260,18],
        [50,60],[190,55],[240,70],[100,80],[170,90],
        [20,100],[270,105],[140,50],[60,130],[200,120],
      ];
      for (var si = 0; si < stars.length; si++) {
        ctx.fillRect(stars[si][0], stars[si][1], 1, 1);
      }

      // ── タイトルロゴ ──────────────────────────────────────────────
      var logoY = 50;
      S.drawText(ctx, 'ユイトと黄金の', VW / 2, logoY, {
        size: 24, color: '#ffd76e', align: 'center', shadow: true, weight: 'bold',
      });
      S.drawText(ctx, 'サッカーボール', VW / 2, logoY + 32, {
        size: 24, color: '#ffd76e', align: 'center', shadow: true, weight: 'bold',
      });

      // ── ユイトのスプライト（ロゴ下） ──────────────────────────────
      if (S.SPRITES && S.SPRITES.yuito) {
        var spriteScale = 4;
        // スプライトのサイズ（16×16前提）でセンタリング
        var spriteW = S.SPRITES.yuito.map[0].length * spriteScale;
        var spriteX = Math.floor((VW - spriteW) / 2);
        var spriteY = logoY + 72;
        S.drawShadow(ctx, VW / 2, spriteY + S.SPRITES.yuito.map.length * spriteScale + 4, 20, 5);
        S.drawSprite(ctx, S.SPRITES.yuito, spriteX, spriteY, spriteScale);
      }

      // ── メニュー ──────────────────────────────────────────────────
      var menuStartY = 280;
      var menuItems  = [
        { label: 'はじめから', idx: 0 },
        { label: 'つづきから', idx: 1 },
      ];
      var hasSave = typeof S.hasSave === 'function' && S.hasSave();

      // メニュー背景ウィンドウ
      S.drawWindow(ctx, VW / 2 - 80, menuStartY - 12, 160, 80, {
        radius: 10,
        border: '#3a5a8a',
      });

      for (var mi = 0; mi < menuItems.length; mi++) {
        var item  = menuItems[mi];
        var itemY = menuStartY + mi * 36;
        var isSelected = _cursor === item.idx;
        var isEnabled  = (item.idx === 0) || hasSave;

        // テキスト色
        var color = isEnabled ? '#dff4ff' : '#556677';
        if (isSelected && isEnabled) color = '#ffffff';

        // カーソル（▶ または ハイライト）
        if (isSelected && isEnabled) {
          // 点滅カーソル
          var blink = Math.floor(_time / 0.5) % 2 === 0;
          if (blink) {
            S.drawText(ctx, '▶', VW / 2 - 56, itemY + 2, {
              size: 16, color: '#ffd76e', align: 'left',
            });
          }
        }

        S.drawText(ctx, item.label, VW / 2, itemY, {
          size: 18, color: color, align: 'center', shadow: isSelected && isEnabled,
        });
      }

      // ── バージョン表示 ────────────────────────────────────────────
      S.drawText(ctx, 'ver 0.1', 4, VH - 20, {
        size: 10, color: '#445566', align: 'left',
      });
    },
  };
}

// ── UMD エクスポート ────────────────────────────────────────────────
(function (root, api) {
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (typeof window !== 'undefined') root.SRPG = Object.assign(root.SRPG || {}, api);
})(typeof window !== 'undefined' ? window : globalThis, {
  createTitleScene: createTitleScene,
});

// === src/main.js ===
// === main.js ===
// 起動エントリ。window がある時だけ動く（Node で読まれても副作用ゼロ）。
// canvas#game → initCanvas → initInput → タイトルシーン push → rAF ループ。

(function () {
  if (typeof window === 'undefined') return; // Node では何もしない

  function start() {
    var S = window.SRPG;
    var canvas = document.getElementById('game');
    if (!canvas) {
      console.error('[main] canvas#game が見つかりません');
      return;
    }

    S.initCanvas(canvas);
    S.initInput(canvas);

    // タイトル画面からゲームを開始する（Task9 〜）
    S.pushScene(S.createTitleScene());

    var last = (typeof performance !== 'undefined' && performance.now)
      ? performance.now() : Date.now();

    function frame(now) {
      var dt = (now - last) / 1000;
      if (dt > 0.1) dt = 0.1; // 大きなフレーム飛びを抑制
      last = now;

      var input = S.pollInput();

      S.updateScenes(dt, input);

      var ctx = S.getCtx();
      if (ctx) {
        ctx.clearRect(0, 0, S.VW, S.VH);
        S.drawScenes(ctx);
        S.drawPad(ctx); // パッドは最前面
      }

      window.requestAnimationFrame(frame);
    }

    window.requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
