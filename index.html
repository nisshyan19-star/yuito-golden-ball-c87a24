// === src/core/rng.js ===
function makeRng(seed) {
  let s = (seed >>> 0) || 1;
  function next() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next,
    rangeInt: (min, max) => min + Math.floor(next() * (max - min + 1)),
    chance: (p) => next() < p,
    pick: (arr) => arr[Math.floor(next() * arr.length)],
  };
}

// CHARACTERS は遅延解決する。ブラウザでは <script> の読み込み順に依存せず、
// 実際に呼ばれた時点で window.SRPG.CHARACTERS を参照する（characters.js が後でも安全）。
function _characters() {
  if (typeof require !== 'undefined') return require('../data/characters.js').CHARACTERS;
  return (typeof window !== 'undefined' && window.SRPG && window.SRPG.CHARACTERS) || {};
}

function createCharacter(id) {
  const def = _characters()[id];
  if (!def) throw new Error('Unknown character id: ' + id);
  return {
    id:       def.id,
    name:     def.name,
    position: def.position,
    level:    1,
    exp:      0,
    maxHp:    def.base.hp,
    hp:       def.base.hp,
    maxMp:    def.base.mp,
    mp:       def.base.mp,
    atk:      def.base.atk,
    def:      def.base.def,
    spd:      def.base.spd,
    skills:   [...def.skills],
    growth:   { ...def.growth },
    equip:    { weapon: null, armor: null },
    dead:     false,
  };
}

function createNewGame() {
  return {
    party:    [createCharacter('yuito')],
    inventory:{ drink: 2 },
    gold:     0,
    flags:    {},
    position: { map: 'field1', x: 5, y: 5 },
    settings: { autoAllies: true },
  };
}

function cloneState(s) {
  return structuredClone(s);
}

/**
 * 次のレベルに必要な経験値
 * @param {number} level
 * @returns {number}
 */
function expForNextLevel(level) {
  return Math.floor(8 * Math.pow(level, 1.6)) + level * 4;
}

/**
 * 経験値を加算し、レベルアップ・能力上昇・技習得を適用する
 * @param {object} character - キャラクターオブジェクト（直接書き換える）
 * @param {number} amount - 加算する経験値
 * @returns {{ leveledUp: boolean, learned: string[] }}
 */
function gainExp(character, amount) {
  let leveledUp = false;
  const learned = [];

  character.exp += amount;

  while (character.exp >= expForNextLevel(character.level)) {
    character.exp -= expForNextLevel(character.level);
    character.level += 1;
    character.maxHp  += character.growth.hp;
    character.maxMp  += character.growth.mp;
    character.atk    += character.growth.atk;
    character.def    += character.growth.def;
    character.spd    += character.growth.spd;
    // レベルアップ時全回復
    character.hp = character.maxHp;
    character.mp = character.maxMp;
    leveledUp = true;
  }

  // 技習得判定（レベルアップが1回でも発生した場合）
  if (leveledUp) {
    for (const skill of Object.values(_skills())) {
      if (
        skill.user === character.id &&
        skill.learnLevel != null &&
        skill.learnLevel <= character.level &&
        !character.skills.includes(skill.id)
      ) {
        character.skills.push(skill.id);
        learned.push(skill.id);
      }
    }
  }

  return { leveledUp, learned };
}

/**
 * useItem(target, item)
 * 道具を target に使い効果をその場で適用する。
 * @returns {{ ok: boolean, message: string }}
 */
function useItem(target, item) {
  const eff = item.effect || {};
  let applied = false;

  // 復活アイテム
  if ('revive' in eff) {
    if (!target.dead) {
      return { ok: false, message: 'まだ たおれていない' };
    }
    target.dead = false;
    target.hp = Math.max(1, Math.floor(target.maxHp * eff.revive));
    return { ok: true, message: 'たちあがった！' };
  }

  // HP / MP 回復（戦闘不能には使えない）
  if ('hp' in eff || 'mp' in eff) {
    if (target.dead) {
      return { ok: false, message: 'たおれていて つかえない' };
    }
    if ('hp' in eff) {
      target.hp = Math.min(target.maxHp, target.hp + eff.hp);
      applied = true;
    }
    if ('mp' in eff) {
      target.mp = Math.min(target.maxMp, target.mp + eff.mp);
      applied = true;
    }
    if (applied) {
      // HP と MP 両方持つ場合も含め、どちらか効けば ok:true
      if ('hp' in eff && !('mp' in eff)) {
        return { ok: true, message: 'HPが かいふくした！' };
      }
      if ('mp' in eff && !('hp' in eff)) {
        return { ok: true, message: 'スタミナが かいふくした！' };
      }
      // 両方
      return { ok: true, message: 'HPが かいふくした！' };
    }
  }

  return { ok: false, message: 'なにも おきなかった' };
}

  const weaponId = character.equip && character.equip.weapon;
  const armorId  = character.equip && character.equip.armor;

  const ITEMS = _items();
  const weaponAtk = (weaponId && ITEMS && ITEMS[weaponId]) ? ITEMS[weaponId].atk : 0;
  const armorDef  = (armorId  && ITEMS && ITEMS[armorId])  ? ITEMS[armorId].def  : 0;

  return {

    def: character.def + (armorDef  || 0),

/**
 * battle.js — 戦闘ダメージ計算コア
 * calcDamage / applyDamage / isDefeated
 */

/**
 * ダメージを計算して返す。
 * @param {{ atk: number }} attacker
 * @param {{ def: number }} defender
 * @param {{ power?: number, rng?: object, crit?: boolean }} [opts]
 * @returns {number} ダメージ値（1以上）
 */
function calcDamage(attacker, defender, opts) {
  var power   = (opts && opts.power != null) ? opts.power : 1;
  var rng     = (opts && opts.rng)  ? opts.rng  : null;
  var critOpt = (opts && opts.crit != null) ? opts.crit : null;

  var base = attacker.atk - defender.def / 2;

  // 乱数の呼び出し順序を固定: 先に variance、次に crit
  var variance = (rng != null) ? (0.9 + 0.2 * rng.next()) : 0.5 + 0.9; // rng無し→中央値1.0相当
  // ※ rng無しの場合 variance = 0.9 + 0.2 * 0.5 = 1.0（中央値）
  if (rng == null) {
    variance = 0.9 + 0.2 * 0.5; // 1.0
  }

  var dmg = Math.max(1, Math.round(base * power * variance));

  // クリティカル判定（乱数呼び出し順: varianceの後）
  var isCrit;
  if (critOpt !== null && critOpt !== undefined) {
    isCrit = !!critOpt;
  } else if (rng != null) {
    isCrit = rng.chance(0.08);
  } else {
    isCrit = false;
  }

  if (isCrit) {
    dmg = Math.max(1, dmg * 2);
  }

  return dmg;
}

/**
 * ダメージをユニットに適用する。
 * @param {{ hp: number, dead: boolean }} target
 * @param {number} dmg
 * @returns {number} 適用後の hp
 */
function applyDamage(target, dmg) {
  target.hp = Math.max(0, target.hp - dmg);
  if (target.hp === 0) {
    target.dead = true;
  }
  return target.hp;
}

/**
 * ユニットが倒されているか判定する。
 * @param {{ hp: number, dead: boolean }} unit
 * @returns {boolean}
 */
function isDefeated(unit) {
  return unit.hp <= 0 || unit.dead === true;
}

// === src/logic/ally-ai.js ===
// SKILLS は data/skills.js で定義済み。単一バンドル時に同名 const が衝突して
// スクリプト全体がパース失敗する（black screen）のを避けるため、トップレベルで

function _skills() {
  if (typeof require !== 'undefined') return require('../data/skills.js').SKILLS;
  return (typeof window !== 'undefined' && window.SRPG && window.SRPG.SKILLS) || {};
}

// ヘルパ関数
function isDead(u) {
  return u.dead === true || u.hp <= 0;
}

function ratio(u) {
  if (!u.maxHp || u.maxHp === 0) return 1;
  return u.hp / u.maxHp;
}

/**
 * おまかせAI: 仲間キャラクターの行動を決定する
 * @param {object} actor - 行動するキャラクター
 * @param {object[]} party - 味方全員（actor含む）
 * @param {object[]} enemies - 敵全員
 * @param {object} rng - 乱数生成器（シグネチャ維持用）
 * @returns {{ type:'attack'|'skill'|'cover', skillId?, targetId? }}
 */
function chooseAllyAction(actor, party, enemies, rng) {
  const aliveEnemies = enemies.filter(e => !isDead(e));
  const aliveAllies = party.filter(p => !isDead(p));
  const SKILLS = _skills();
  const mySkills = actor.skills.map(id => SKILLS[id]).filter(Boolean);

  function canUse(s) {
    return s && actor.mp >= s.mp;
  }

  // 1. 回復役（heal技を所持）
  const healSkills = mySkills.filter(s => s.type === 'heal');
  if (healSkills.length > 0) {
    const dyingAllies = aliveAllies.filter(a => ratio(a) <= 0.35);

    // 瀕死が2人以上かつ全体回復が使える
    if (dyingAllies.length >= 2) {
      const aoeHeal = healSkills.find(s => s.target === 'allies' && canUse(s));
      if (aoeHeal) {
        return { type: 'skill', skillId: aoeHeal.id };
      }
    }

    // 瀕死が1人以上かつ単体回復が使える
    if (dyingAllies.length >= 1) {
      const singleHeal = healSkills.find(s => s.target === 'ally' && canUse(s));
      if (singleHeal) {
        // 最も ratio の低い瀕死味方を対象に
        const target = dyingAllies.reduce((a, b) => ratio(a) <= ratio(b) ? a : b);
        return { type: 'skill', skillId: singleHeal.id, targetId: target.id };
      }
    }
    // 瀕死がいない／MP不足なら次へフォールスルー
  }

  // 2. かばう役（cover技を所持）
  const coverSkills = mySkills.filter(s => s.type === 'cover');
  if (coverSkills.length > 0) {
    const dyingOthers = aliveAllies.filter(a => a.id !== actor.id && ratio(a) <= 0.35);
    if (dyingOthers.length > 0) {
      const coverSkill = coverSkills[0];
      const target = dyingOthers.reduce((a, b) => ratio(a) <= ratio(b) ? a : b);
      return { type: 'cover', skillId: coverSkill.id, targetId: target.id };
    }
  }

  // 3. 全体攻撃 & 敵2体以上
  const aoeAttack = mySkills.find(s => s.type === 'attack' && s.target === 'all' && canUse(s));
  if (aoeAttack && aliveEnemies.length >= 2) {
    return { type: 'skill', skillId: aoeAttack.id };
  }

  // 4. 単体必殺技（power高い順） & MP足りる
  const oneAttacks = mySkills
    .filter(s => s.type === 'attack' && s.target === 'one' && canUse(s))
    .sort((a, b) => (b.power || 0) - (a.power || 0));
  if (oneAttacks.length > 0 && aliveEnemies.length > 0) {
    const best = oneAttacks[0];
    const target = aliveEnemies.reduce((a, b) => a.hp <= b.hp ? a : b);
    return { type: 'skill', skillId: best.id, targetId: target.id };
  }

  // 5. 通常攻撃：最も hp の低い生存敵を狙う
  if (aliveEnemies.length > 0) {
    const target = aliveEnemies.reduce((a, b) => a.hp <= b.hp ? a : b);
    return { type: 'attack', targetId: target.id };
  }

  // 6. 生存敵がいない保険
  return { type: 'attack', targetId: null };
}

  var iw = (typeof window !== 'undefined') ? window.innerWidth : VW;

  _canvasEl.style.height = (VH * cssScale) + 'px';

  _canvasEl.width  = Math.round(VW * cssScale * dpr);
  _canvasEl.height = Math.round(VH * cssScale * dpr);

  _ctx = _canvasEl.getContext('2d');
  _ctx.setTransform(cssScale * dpr, 0, 0, cssScale * dpr, 0, 0);
  _ctx.imageSmoothingEnabled = false;
}

/**
 * drawSprite: スプライトを描画する
 * @param {CanvasRenderingContext2D} ctx
 * @param {Object} sprite  { map: string[], palette: Object }
 * @param {number} x       左上X（仮想座標）
 * @param {number} y       左上Y（仮想座標）
 * @param {number} [scale] 1ピクセル=何仮想px か（デフォルト1）
 */
function drawSprite(ctx, sprite, x, y, scale) {
  if (!sprite || !sprite.map) return;
  scale = scale || 1;
  var map = sprite.map;
  var palette = sprite.palette;
  for (var row = 0; row < map.length; row++) {
    var line = map[row];
    for (var col = 0; col < line.length; col++) {
      var ch = line[col];
      if (ch === '.' || ch === ' ') continue;
      var color = palette[ch];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(x + col * scale, y + row * scale, scale, scale);
    }
  }
}

/**
 * drawTileMap: タイルマップを描画する
 * @param {CanvasRenderingContext2D} ctx
 * @param {string[][]} grid       2次元配列（各文字が tileSprites のキー）
 * @param {Object} tileSprites    { key: sprite, ... }
 * @param {number} tileSize       タイルの仮想px（スプライトは16px前提）
 * @param {number} offsetX
 * @param {number} offsetY
 */
function drawTileMap(ctx, grid, tileSprites, tileSize, offsetX, offsetY) {
  var scale = tileSize / 16;
  for (var r = 0; r < grid.length; r++) {
    for (var c = 0; c < grid[r].length; c++) {
      var key = grid[r][c];
      var sp = tileSprites[key];
      if (!sp) continue;
      drawSprite(ctx, sp, offsetX + c * tileSize, offsetY + r * tileSize, scale);
    }
  }
}

  var color  = opts.color || '#ffffff';

    x: (clientX - rect.left) * (VW / rect.width),
    y: (clientY - rect.top) * (VH / rect.height),

    case 'ArrowDown': case 'Down': return 'down';

    right: _held.right && !_prevHeld.right,
    confirm: _held.confirm && !_prevHeld.confirm,
    cancel: _held.cancel && !_prevHeld.cancel,

    right: _held.right, confirm: _held.confirm, cancel: _held.cancel,

// --- 描画 ---
function _drawDirButton(ctx, key, label) {
  var b = BTN_DEFS[key];
  var active = _held[key];
  var fill = active ? 'rgba(94,200,255,0.55)' : 'rgba(40,46,72,0.85)';
  var border = active ? '#bff0ff' : '#5ec8ff';
  ctx.save();
  ctx.fillStyle = fill;
  ctx.strokeStyle = border;
  ctx.lineWidth = 2;
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 10);
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }
  // 矢印グリフ
  ctx.fillStyle = active ? '#0b0b12' : '#dff4ff';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.restore();
}

function _drawActButton(ctx, key) {
  var b = BTN_DEFS[key];
  var active = _held[key];
  var base = key === 'confirm' ? '#4caf50' : '#e0556b';
  var hi = key === 'confirm' ? '#a5ffb0' : '#ffb3c0';

  ctx.beginPath();
  ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2);

  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.stroke();
  ctx.fillStyle = active ? '#0b0b12' : '#ffffff';
  ctx.font = '11px "Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.cx, b.cy + 1);
  ctx.restore();

// 仮想座標で画面下部に十字キー＋決定/キャンセルを描画。押下中はハイライト。

  _drawDirButton(ctx, 'down', '▼');
  _drawDirButton(ctx, 'left', '◀');

// メッセージウィンドウ（タイプライター文字送り・ページ送り対応のモーダルシーン）。

/**
 * wrapText: 文字列を最大文字数で折り返す。
 * '\n' で先に分割し、各行を maxCharsPerLine 文字で詰める。
 * @param {string} str
 * @param {number} maxCharsPerLine
 * @returns {string[]}
 */
function wrapText(str, maxCharsPerLine) {
  var lines = str.split('\n');
  var result = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.length === 0) {
      result.push('');
      continue;
    }
    var pos = 0;
    while (pos < line.length) {
      result.push(line.slice(pos, pos + maxCharsPerLine));
      pos += maxCharsPerLine;
    }
  }
  return result;
}

/**
 * DialogState: dialog の純粋ロジック状態。draw 不要な部分だけを分離。
 * update(dt, pressedConfirm) → { done: bool, changed: bool }

function createDialogState(pages) {
  var _pages       = pages || [''];
  var _pageIndex   = 0;       // 現在のページ番号
  var _charIndex   = 0;       // 表示済み文字数（現在ページ内）
  var _elapsed     = 0;       // 文字送り用タイマー
  var _done        = false;
  var CHARS_PER_SEC = 45;     // 文字送り速度

  function _currentPage() { return _pages[_pageIndex] || ''; }
  function _isLastPage()  { return _pageIndex >= _pages.length - 1; }
  function _isFullyShown(){ return _charIndex >= _currentPage().length; }

  function update(dt, pressedConfirm) {
    if (_done) return { done: true, changed: false };

    // 文字送り（確定押されていない間）
    if (!pressedConfirm) {
      _elapsed += dt;
      var newChars = Math.floor(_elapsed * CHARS_PER_SEC);
      if (newChars > _charIndex) {
        _charIndex = Math.min(newChars, _currentPage().length);
      }
      return { done: false, changed: false };
    }

    // confirm が押された
    if (!_isFullyShown()) {
      // 送り途中 → 全部表示
      _charIndex = _currentPage().length;
      return { done: false, changed: false };
    }

    // 全部表示済み → 次ページへ or 完了
    if (!_isLastPage()) {
      _pageIndex++;
      _charIndex = 0;
      _elapsed   = 0;
      return { done: false, changed: true };
    }

    // 最終ページで confirm → 完了
    _done = true;
    return { done: true, changed: false };
  }

    return _currentPage().slice(0, _charIndex);
  }

  function isDone() { return _done; }
  function isPageComplete() { return _isFullyShown(); }

  return {
    update: update,
    getVisibleText: getVisibleText,
    isDone: isDone,
    isPageComplete: isPageComplete,
  };

/**
 * createTitleScene: タイトル画面シーンを生成して返す。
 * @returns シーンオブジェクト { update, draw }
 */
function createTitleScene() {
  // 選択項目: 0=はじめから, 1=つづきから
  var _cursor = 0; // 現在のカーソル位置
  var _time   = 0; // アニメーション用タイマー

  // 選択可能な項目インデックスの配列を動的に返す（セーブ無しは「はじめから」のみ）

    var S = (typeof window !== 'undefined') ? window.SRPG : null;
    var hasSave = S && typeof S.hasSave === 'function' && S.hasSave();
    return hasSave ? [0, 1] : [0];
  }

  return {
    update: function (dt, input) {
      _time += dt;
      if (!input || !input.pressed) return;
      var pr = input.pressed;
      var selectable = _selectableItems();

      // 上下でカーソル移動（選択可能項目だけを巡回）
      if (pr.up || pr.down) {
        var idx = selectable.indexOf(_cursor);
        if (pr.down) idx = (idx + 1) % selectable.length;
        if (pr.up)   idx = (idx - 1 + selectable.length) % selectable.length;
        _cursor = selectable[idx];
      }

      // 決定
      if (pr.confirm) {
        var S = (typeof window !== 'undefined') ? window.SRPG : null;
        if (!S) return;

        if (_cursor === 0) {
          // はじめから
          var newState = S.createNewGame();
          S.saveGame(newState);
          // 導入ダイアログを push（onComplete でゲーム開始）
          S.pushScene(S.createDialog(
            [
              'ユイトは サッカーが だいすきな 9さいの しょうねん。',
              'ある日、町の たからもの「黄金のサッカーボール」が ぬすまれた！',
              'ユイトの ぼうけんが はじまる！',
            ],
            {
              onComplete: function () { _startGame(newState); },
            }
          ));

        } else if (_cursor === 1) {
          // つづきから
          var saved = S.loadGame();
          if (saved) {
            _startGame(saved);
          }
        }
      }
    },

    draw: function (ctx) {
      var S = (typeof window !== 'undefined') ? window.SRPG : null;
      if (!S) return;
      var VW = S.VW;
      var VH = S.VH;

      // ── 背景（濃紺グラデ） ─────────────────────────────────────────
      var grad = ctx.createLinearGradient(0, 0, 0, VH);
      grad.addColorStop(0, '#0a0e1c');
      grad.addColorStop(1, '#0e1830');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, VW, VH);

      // ── 星の装飾（シンプルドット） ────────────────────────────────
      // 固定シードで擬似ランダムな星を描く（毎フレーム同じ位置）
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      var stars = [
        [30,20],[80,40],[150,15],[220,35],[260,18],
        [50,60],[190,55],[240,70],[100,80],[170,90],
        [20,100],[270,105],[140,50],[60,130],[200,120],
      ];
      for (var si = 0; si < stars.length; si++) {
        ctx.fillRect(stars[si][0], stars[si][1], 1, 1);
      }

      // ── タイトルロゴ ──────────────────────────────────────────────
      var logoY = 50;
      S.drawText(ctx, 'ユイトと黄金の', VW / 2, logoY, {
        size: 24, color: '#ffd76e', align: 'center', shadow: true, weight: 'bold',
      });
      S.drawText(ctx, 'サッカーボール', VW / 2, logoY + 32, {
        size: 24, color: '#ffd76e', align: 'center', shadow: true, weight: 'bold',
      });

      // ── ユイトのスプライト（ロゴ下） ──────────────────────────────
      if (S.SPRITES && S.SPRITES.yuito) {
        var spriteScale = 4;
        // スプライトのサイズ（16×16前提）でセンタリング
        var spriteW = S.SPRITES.yuito.map[0].length * spriteScale;
        var spriteX = Math.floor((VW - spriteW) / 2);
        var spriteY = logoY + 72;
        S.drawShadow(ctx, VW / 2, spriteY + S.SPRITES.yuito.map.length * spriteScale + 4, 20, 5);
        S.drawSprite(ctx, S.SPRITES.yuito, spriteX, spriteY, spriteScale);
      }

      // ── メニュー ──────────────────────────────────────────────────
      var menuStartY = 280;
      var menuItems  = [
        { label: 'はじめから', idx: 0 },
        { label: 'つづきから', idx: 1 },
      ];
      var hasSave = typeof S.hasSave === 'function' && S.hasSave();

      // メニュー背景ウィンドウ
      S.drawWindow(ctx, VW / 2 - 80, menuStartY - 12, 160, 80, {
        radius: 10,
        border: '#3a5a8a',
      });

      for (var mi = 0; mi < menuItems.length; mi++) {
        var item  = menuItems[mi];
        var itemY = menuStartY + mi * 36;
        var isSelected = _cursor === item.idx;
        var isEnabled  = (item.idx === 0) || hasSave;

        // テキスト色
        var color = isEnabled ? '#dff4ff' : '#556677';
        if (isSelected && isEnabled) color = '#ffffff';

        // カーソル（▶ または ハイライト）
        if (isSelected && isEnabled) {
          // 点滅カーソル
          var blink = Math.floor(_time / 0.5) % 2 === 0;
          if (blink) {
            S.drawText(ctx, '▶', VW / 2 - 56, itemY + 2, {
              size: 16, color: '#ffd76e', align: 'left',
            });
          }
        }

        S.drawText(ctx, item.label, VW / 2, itemY, {
          size: 18, color: color, align: 'center', shadow: isSelected && isEnabled,
        });
      }

      // ── バージョン表示 ────────────────────────────────────────────
      S.drawText(ctx, 'ver 0.1', 4, VH - 20, {
        size: 10, color: '#445566', align: 'left',
      });
    },
  };
}

// NPC と話す / 宝箱を開ける / ランダムエンカウントする。

// window/document はシーン本体の update/draw 内でのみ参照（Node require で副作用ゼロ）。

// ── データ遅延解決（game-state.js の _characters() と同じパターン） ──────
//   Node: require でモジュールから取得。ブラウザ: window.SRPG から取得。
function _tileLegend() {
  if (typeof require !== 'undefined') return require('../data/maps.js').TILE_LEGEND;
  return (typeof window !== 'undefined' && window.SRPG && window.SRPG.TILE_LEGEND) || {};

// ── 純粋ロジック（テスト対象） ──────────────────────────────────────

/**
 * frontTile: 向き facing の正面（隣接）タイル座標を返す。
 * @param {number} x
 * @param {number} y
 * @param {string} facing 'up' | 'down' | 'left' | 'right'
 * @returns {{x:number, y:number}}
 */
function frontTile(x, y, facing) {
  switch (facing) {
    case 'up':    return { x: x,     y: y - 1 };
    case 'down':  return { x: x,     y: y + 1 };
    case 'left':  return { x: x - 1, y: y     };
    case 'right': return { x: x + 1, y: y     };
    default:      return { x: x,     y: y     };
  }
}

/**
 * isWalkable: 座標 (x,y) に踏み込めるか判定する。
 *   - グリッド範囲外 → false
 *   - タイルが walkable:false（壁/水）→ false
 *   - NPC が居る → false
 *   - 未開封の宝箱がある → false（開封済みは通れる）
 * @param {Object} map     MAPS のエントリ（grid / npcs / chests を持つ）
 * @param {number} x
 * @param {number} y
 * @param {Object} [opened] { chestId: true } の開封済み集合
 * @returns {boolean}
 */
function isWalkable(map, x, y, opened) {
  opened = opened || {};
  var grid = map.grid;
  // 範囲外
  if (y < 0 || y >= grid.length) return false;
  var row = grid[y];
  if (x < 0 || x >= row.length) return false;
  // タイル種別
  var legend = _tileLegend();
  var tile = legend[row[x]];
  if (!tile || !tile.walkable) return false;
  // NPC
  var npcs = map.npcs || [];
  for (var i = 0; i < npcs.length; i++) {
    if (npcs[i].x === x && npcs[i].y === y) return false;
  }
  // 未開封の宝箱
  var chests = map.chests || [];
  for (var j = 0; j < chests.length; j++) {
    var c = chests[j];
    if (c.x === x && c.y === y && !opened[c.id]) return false;
  }
  return true;
}

/**
 * clampCamera: カメラオフセットを画面内に収める。
 *   - 地図が画面以下のサイズ → 中央寄せ（(screen-mapPx)/2 を四捨五入）
 *   - それ以外 → desired を [screen-mapPx, 0] にクランプ
 * @param {number} desired 望ましいオフセット
 * @param {number} screen  画面サイズ（幅 or 高さ）
 * @param {number} mapPx   地図のピクセルサイズ
 * @returns {number}
 */
function clampCamera(desired, screen, mapPx) {
  if (mapPx <= screen) return Math.round((screen - mapPx) / 2);
  var min = screen - mapPx; // 負の値（地図右/下端を画面端に合わせる下限）
  var max = 0;
  if (desired < min) return min;
  if (desired > max) return max;
  return desired;
}

// ── シーンファクトリ ────────────────────────────────────────────────

/**
 * createFieldScene: フィールド探索シーンを生成して返す。
 * @param {Object} state GameState（position / flags / inventory を読み書きする）
 * @returns シーンオブジェクト { update, draw }（opaque）
 */
function createFieldScene(state) {
  var S = (typeof window !== 'undefined') ? window.SRPG : null;

  // ── マップ取得（ブラウザでは window.SRPG.MAPS、保険で field1 へフォールバック） ──
  var allMaps = (S && S.MAPS) ? S.MAPS : _maps();
  var pos = (state && state.position) || {};
  var map = allMaps[pos.map] || allMaps.field1;

  // ── プレイヤー状態 ───────────────────────────────────────────────
  var px = (pos.x !== undefined && pos.x !== null) ? pos.x : 5;
  var py = (pos.y !== undefined && pos.y !== null) ? pos.y : 5;
  var facing = 'down';
  var moveTimer = 0;

  // ── 宝箱の開封状態を flags から復元 ───────────────────────────────
  var opened = {};
  (map.chests || []).forEach(function (c) {
    opened[c.id] = !!(state.flags && state.flags['chest_' + c.id]);
  });

  // ── 定数 ─────────────────────────────────────────────────────────
  var TS = 32;            // タイルの仮想px（16pxスプライトを2倍）
  var STEP_TIME = 0.15;   // 1マス移動のクールダウン秒

  // ── 内部ヘルパ ───────────────────────────────────────────────────

  // facing 正面の NPC を返す（なければ null）
  function _npcAt(x, y) {
    var npcs = map.npcs || [];
    for (var i = 0; i < npcs.length; i++) {
      if (npcs[i].x === x && npcs[i].y === y) return npcs[i];
    }
    return null;
  }

  // facing 正面の未開封宝箱を返す（なければ null）
  function _chestAt(x, y) {
    var chests = map.chests || [];
    for (var i = 0; i < chests.length; i++) {
      var c = chests[i];
      if (c.x === x && c.y === y && !opened[c.id]) return c;
    }
    return null;
  }

  // 調べる/話す
  function _interact() {
    if (!S) return;
    var f = frontTile(px, py, facing);
    // NPC と会話
    var npc = _npcAt(f.x, f.y);
    if (npc) {
      S.pushScene(S.createDialog(npc.pages));
      return;
    }
    // 宝箱を開封
    var chest = _chestAt(f.x, f.y);
    if (chest) {
      opened[chest.id] = true;
      if (!state.flags) state.flags = {};
      state.flags['chest_' + chest.id] = true;
      if (!state.inventory) state.inventory = {};
      state.inventory[chest.item] = (state.inventory[chest.item] || 0) + chest.amount;
      S.saveGame(state);
      S.pushScene(S.createDialog([
        'たからばこを あけた！',
        chest.label + 'を てにいれた！',
      ]));
      return;
    }
  }

  // エンカウント抽選（draw 側の view レイヤなので Math.random 使用可・テスト対象外）
  function _maybeEncounter() {
    if (!map.encounter) return;
    if (Math.random() < map.encounter.rate) _triggerEncounter();
  }

  // バトルへ遷移（Task11 未実装ならダイアログのスタブ）
  function _triggerEncounter() {
    if (!S) return;
    if (typeof S.createBattleScene === 'function') {
      S.pushScene(S.createBattleScene(state, map.encounter.enemies));
    } else {
      S.pushScene(S.createDialog([
        'てきが あらわれた！',
        '（バトルは Task11 でつくるよ）',
      ]));
    }
  }

  return {
    update: function (dt, input) {
      if (!S) return;
      var pressed = (input && input.pressed) || {};
      var held    = (input && input.held)    || {};

      // 1. メニュー（cancel）
      if (pressed.cancel) {
        if (typeof S.createMenuScene === 'function') {
          S.pushScene(S.createMenuScene(state));
        } else {
          S.pushScene(S.createDialog(['メニューは Task12 でつくるよ']));
        }
        return;
      }

      // 2. 調べる/話す（confirm）
      if (pressed.confirm) {
        _interact();
        return;
      }

      // 3. 移動（held）
      moveTimer -= dt;
      if (moveTimer < 0) moveTimer = 0;

      var dir = held.up ? 'up'
              : held.down ? 'down'
              : held.left ? 'left'
              : held.right ? 'right'
              : null;

      if (!dir) { moveTimer = 0; return; }

      facing = dir;
      if (moveTimer > 0) return;

      var nt = frontTile(px, py, dir);
      if (isWalkable(map, nt.x, nt.y, opened)) {
        px = nt.x; py = nt.y;
        state.position.x = px;
        state.position.y = py;
        moveTimer = STEP_TIME;
        _maybeEncounter();
      } else {
        // 壁ドンの軽い間
        moveTimer = STEP_TIME * 0.7;
      }
    },

    draw: function (ctx) {
      if (!S) return;
      var VW = S.VW, VH = S.VH;

      // 1. 背景（地図外のはみ出し対策）
      ctx.fillStyle = '#0a0e1c';
      ctx.fillRect(0, 0, VW, VH);

      // 2. カメラ（プレイヤー中央・端でクランプ）
      var cols = map.grid[0].length, rows = map.grid.length;
      var mapW = cols * TS, mapH = rows * TS;
      var offX = clampCamera(Math.round(VW / 2 - (px * TS + TS / 2)), VW, mapW);
      var offY = clampCamera(Math.round(VH / 2 - (py * TS + TS / 2)), VH, mapH);

      // 3. タイル描画（可視範囲だけカリング）
      var legend = _tileLegend();
      var c0 = Math.max(0, Math.floor(-offX / TS));
      var c1 = Math.min(cols - 1, Math.floor((VW - offX) / TS));
      var r0 = Math.max(0, Math.floor(-offY / TS));
      var r1 = Math.min(rows - 1, Math.floor((VH - offY) / TS));
      for (var r = r0; r <= r1; r++) {
        var rowStr = map.grid[r];
        for (var c = c0; c <= c1; c++) {
          var t = legend[rowStr[c]];
          if (!t) continue;
          var sp = S.SPRITES[t.sprite];
          if (!sp) continue;
          S.drawSprite(ctx, sp, offX + c * TS, offY + r * TS, TS / 16);
        }
      }

      // 4. 宝箱（未開封のみ・簡易プリミティブ）
      var chests = map.chests || [];
      for (var ci = 0; ci < chests.length; ci++) {
        var ch = chests[ci];
        if (opened[ch.id]) continue;
        var sx = offX + ch.x * TS, sy = offY + ch.y * TS;
        ctx.fillStyle = '#8a5a2e'; ctx.fillRect(sx + 5, sy + 13, TS - 10, TS - 15);
        ctx.fillStyle = '#a86b34'; ctx.fillRect(sx + 5, sy + 9, TS - 10, 7);
        ctx.fillStyle = '#ffd76e';
        ctx.fillRect(sx + TS / 2 - 2, sy + 9, 4, TS - 12);
        ctx.fillRect(sx + 5, sy + 15, TS - 10, 3);
        ctx.strokeStyle = '#3a230f'; ctx.lineWidth = 1;
        ctx.strokeRect(sx + 5, sy + 9, TS - 10, TS - 13);
      }

      // 5. NPC
      var npcs = map.npcs || [];
      for (var ni = 0; ni < npcs.length; ni++) {
        var npc = npcs[ni];
        var nsp = S.SPRITES[npc.sprite];
        S.drawShadow(ctx, offX + npc.x * TS + TS / 2, offY + npc.y * TS + TS - 3, 10, 4);
        if (nsp) S.drawSprite(ctx, nsp, offX + npc.x * TS, offY + npc.y * TS, 1);
      }

      // 6. プレイヤー
      S.drawShadow(ctx, offX + px * TS + TS / 2, offY + py * TS + TS - 3, 11, 4);
      S.drawSprite(ctx, S.SPRITES.yuito, offX + px * TS, offY + py * TS, 1);

      // 7. ネームプレート（画面上部）
      S.drawWindow(ctx, VW / 2 - 60, 6, 120, 24, { radius: 8, border: '#5ec8ff' });
      S.drawText(ctx, map.name, VW / 2, 12, { size: 13, color: '#dff4ff', align: 'center' });
    },
  };
}

// === src/scenes/battle-scene.js ===
// バトルシーン（フロントビュー・ターン制）。
// field-scene が S.createBattleScene(state, enemyPool) で push する。
// 戦闘終了は S.popScene() でフィールドへ戻る（replace ではない）。
//
// ⚠️ バンドルスコープの鉄則：単一 index.html では全 src が 1 スコープを共有するため
//    トップレベルの const/let は同名衝突で構文エラー（黒画面）になる。
//    → このファイルはトップレベルを「関数宣言のみ」にし、データ(ENEMIES/SKILLS/ITEMS)は
//      遅延解決する。シーン内部の const/let は関数スコープなので衝突しない。

// ── データ遅延解決（node=require / browser=window.SRPG） ──────────────
function _bsEnemies() {
  if (typeof require !== 'undefined') return require('../data/enemies.js').ENEMIES;
  return (typeof window !== 'undefined' && window.SRPG && window.SRPG.ENEMIES) || {};
}

// ── 純粋ロジック（テスト対象） ────────────────────────────────────────

/**
 * spawnEnemies(pool, rng)
 * エンカウントのプール（敵id配列）から 1〜3 体の戦闘用インスタンスを生成する。
 * 同じ敵が複数なら名前に A/B/C 接尾辞を付けて区別する。
 * インスタンスの id は一意（baseId#index）。baseId は色/種別判定用。
 * @returns {object[]}
 */
function spawnEnemies(pool, rng) {
  const ENEMIES = _bsEnemies();
  const valid = (pool || []).filter((id) => ENEMIES[id]);
  if (!valid.length) return [];

  const n = (rng && rng.rangeInt) ? rng.rangeInt(1, 3) : 1;
  const picks = [];
  for (let i = 0; i < n; i++) {
    const id = (rng && rng.pick) ? rng.pick(valid) : valid[i % valid.length];
    picks.push(id);
  }

  const insts = picks.map((id, idx) => {
    const base = ENEMIES[id];
    return {
      id: id + '#' + idx,
      baseId: id,
      name: base.name,
      maxHp: base.hp, hp: base.hp,
      atk: base.atk, def: base.def, spd: base.spd,
      exp: base.exp, gold: base.gold,
      isBoss: !!base.isBoss,
      isEnemy: true,
      dead: false,
    };
  });

  // 同じ baseId が複数あれば名前に A/B/C を付ける
  insts.forEach((inst) => {
    const same = insts.filter((x) => x.baseId === inst.baseId);
    if (same.length > 1) {
      const pos = same.indexOf(inst);
      inst.name = inst.name + ' ' + 'ABCDE'.charAt(pos);
    }
  });
  return insts;
}

/**
 * buildTurnOrder(units)
 * 素早さ降順・同速は入力順（安定）に並べた配列を返す（非破壊）。
 */
function buildTurnOrder(units) {
  return (units || [])
    .map((u, i) => ({ u, i }))
    .sort((a, b) => (b.u.spd - a.u.spd) || (a.i - b.i))
    .map((x) => x.u);
}

/**
 * chooseEnemyAction(enemy, party, rng)
 * 敵の簡易AI：生存している味方をランダムに通常攻撃する。
 * @returns {{ type:'attack', targetId:(string|null) }}
 */
function chooseEnemyAction(enemy, party, rng) {
  const alive = (party || []).filter((p) => !(p.dead === true || p.hp <= 0));
  if (!alive.length) return { type: 'attack', targetId: null };
  const t = (rng && rng.pick) ? rng.pick(alive) : alive[0];
  return { type: 'attack', targetId: t.id };
}

/**
 * calcReward(enemies)
 * 撃破した敵全員の exp / gold を合算する。
 * @returns {{ exp:number, gold:number }}
 */
function calcReward(enemies) {
  let exp = 0, gold = 0;
  (enemies || []).forEach((e) => { exp += (e.exp || 0); gold += (e.gold || 0); });
  return { exp, gold };
}

// ── シーン本体（ブラウザ実行・目視検証） ──────────────────────────────

/**
 * createBattleScene(state, enemyPool)
 * @param {object} state - GameState（party を直接参照しHP/MP/expを永続させる）
 * @param {string[]} enemyPool - エンカウントの敵idプール
 * @returns {{ update:Function, draw:Function }}
 */
function createBattleScene(state, enemyPool) {
  const S = (typeof window !== 'undefined') ? window.SRPG : null;

  // 仮想解像度
  const VW = (S && S.VW) || 288;
  const VH = (S && S.VH) || 512;

  // レイアウト定数（バーチャルパッド y≈357-507 に被らないよう上に収める）
  const AX = 8, AW = VW - 16;        // 下段ウィンドウ x / 幅
  const PSY = 184, PSH = 40;          // パーティ状態ストリップ
  const ACY = 228, ACH = 118;         // コマンド/メッセージ領域（下端346 < pad357）

  // 戦闘専用の乱数（実機は Math.random ベース）
  const rng = {
    next: function () { return Math.random(); },
    rangeInt: function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
    chance: function (p) { return Math.random() < p; },
    pick: function (arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  };

  const enemies = spawnEnemies(enemyPool, rng);

  // ── 状態 ──
  let phase = 'intro';        // 'intro' | 'command' | 'resolve' | 'over'
  let round = 0;
  let _msg = null, _msgDone = null;
  let cmdMode = 'root';       // 'root' | 'skill' | 'item' | 'target'
  let cursor = 0;
  let menuList = [];
  let pendingSkill = null, pendingItem = null, targetKind = null;
  let playerAction = null;
  let actionQueue = [], aqIndex = 0;
  let fleeFailMsg = false;

  // ── 小ヘルパ ──
  function _isDead(u) { return !u || u.dead === true || u.hp <= 0; }
  function _yuito() { return state.party.find((p) => p.id === 'yuito') || state.party[0]; }
  function _aliveParty() { return state.party.filter((p) => !_isDead(p)); }
  function _aliveEnemies() { return enemies.filter((e) => !_isDead(e)); }
  function _findUnit(id) {
    return state.party.find((p) => p.id === id) || enemies.find((e) => e.id === id) || null;
  }
  function _enemiesCleared() { return enemies.every(_isDead); }
  function _partyWiped() { return state.party.every(_isDead); }

  function _eff(u) {
    if (u.isEnemy) return { atk: u.atk, def: u.def };
    if (S && S.applyEquip) { const e = S.applyEquip(u); return { atk: e.atk, def: e.def }; }
    return { atk: u.atk, def: u.def };
  }

  // メッセージ表示（dialogState を流用してタイプライター＋ページ送り）
  function _showMessages(pages, onDone) {
    pages = (pages || []).filter((p) => p != null && p !== '');
    if (!pages.length) { if (onDone) onDone(); return; }
    if (S && S.createDialogState) {
      _msg = S.createDialogState(pages);
      _msgDone = onDone || null;
    } else {
      if (onDone) onDone();
    }
  }

  function _introText() {
    if (!enemies.length) return '…てきは いなかった。';
    const names = enemies.map((e) => e.name);
    if (names.length === 1) return names[0] + 'が あらわれた！';
    return names.join('と') + 'が あらわれた！';
  }

  // ── 行動の実行（メッセージ配列を返す／何もしない時は null） ──
  function _redirect(attacker, target) {
    // 敵→味方攻撃で、対象を「かばっている」生存味方がいれば肩代わり
    if (attacker.isEnemy && target && !target.isEnemy) {
      const coverer = state.party.find(
        (p) => !_isDead(p) && p._covering === target.id && p.id !== target.id);
      if (coverer) return coverer;
    }
    return target;
  }

  function _damage(a, d) {
    if (S && S.calcDamage) return S.calcDamage({ atk: a }, { def: d }, { power: 1, rng });
    return Math.max(1, a - Math.floor(d / 2));
  }
  function _dealAttack(attacker, target, power) {
    const a = _eff(attacker).atk, d = _eff(target).def;
    let dmg;
    if (S && S.calcDamage) dmg = S.calcDamage({ atk: a }, { def: d }, { power: power || 1, rng });
    else dmg = Math.max(1, Math.round((a - d / 2) * (power || 1)));
    if (target._defending) dmg = Math.max(1, Math.floor(dmg / 2));
    if (S && S.applyDamage) S.applyDamage(target, dmg);
    else { target.hp = Math.max(0, target.hp - dmg); if (target.hp === 0) target.dead = true; }
    return dmg;
  }
  function _deathLine(target) {
    return target.isEnemy
      ? (target.name + 'を たおした！')
      : (target.name + 'は たおれてしまった！');
  }

  function _attack(actor, target) {
    if (!target || _isDead(target)) {
      target = actor.isEnemy ? _aliveParty()[0] : _aliveEnemies()[0];
    }
    if (!target) return null;
    target = _redirect(actor, target);
    const dmg = _dealAttack(actor, target, 1);
    const pages = [actor.name + 'の こうげき！\n' + target.name + 'に ' + dmg + 'の ダメージ！'];
    if (_isDead(target)) pages.push(_deathLine(target));
    return pages;
  }

  function _useSkill(actor, skillId, targetId) {
    const SKILLS = (S && S.SKILLS) || {};
    const sk = SKILLS[skillId];
    if (!sk) return _attack(actor, _findUnit(targetId));
    if (actor.mp < sk.mp) return [actor.name + 'は スタミナが たりない！'];
    actor.mp -= sk.mp;
    const pages = [actor.name + 'の 「' + sk.name + '」！'];

    if (sk.type === 'attack') {
      if (sk.target === 'all') {
        const targets = _aliveEnemies();
        targets.forEach((t) => _dealAttack(actor, t, sk.power || 1));
        pages.push('てき ぜんたいに ダメージ！');
        targets.filter(_isDead).forEach((t) => pages.push(_deathLine(t)));
      } else {
        let t = _findUnit(targetId);
        if (!t || _isDead(t)) t = _aliveEnemies()[0];
        if (t) {
          const dmg = _dealAttack(actor, t, sk.power || 1);
          pages.push(t.name + 'に ' + dmg + 'の ダメージ！');
          if (_isDead(t)) pages.push(_deathLine(t));
        }
      }
    } else if (sk.type === 'heal') {
      const amt = sk.heal || sk.amount || 0;
      if (sk.target === 'allies') {
        _aliveParty().forEach((a) => { a.hp = Math.min(a.maxHp, a.hp + amt); });
        pages.push('みんなの HPが かいふくした！');
      } else {
        let t = _findUnit(targetId) || actor;
        t.hp = Math.min(t.maxHp, t.hp + amt);
        pages.push(t.name + 'の HPが かいふくした！');
      }
    } else if (sk.type === 'buff_def') {
      let t = _findUnit(targetId) || actor;
      t._defending = true;
      pages.push(t.name + 'の まもりが かたくなった！');
    } else {
      pages.push('こうかが なかった…');
    }
    return pages;
  }

  function _useItemAction(actor, itemId, targetId) {
    const ITEMS = (S && S.ITEMS) || {};
    const it = ITEMS[itemId];
    if (!it) return null;
    if ((state.inventory[itemId] || 0) <= 0) return [actor.name + 'は どうぐを もっていない！'];
    const t = _findUnit(targetId) || actor;
    let r = { ok: true, message: '' };
    if (S && S.useItem) r = S.useItem(t, it);
    if (r.ok) state.inventory[itemId] = (state.inventory[itemId] || 1) - 1;
    return [actor.name + 'は ' + it.name + 'を つかった！\n' + (r.message || '')];
  }

  function _performAction(actor) {
    if (actor.isEnemy) {
      const act = chooseEnemyAction(actor, state.party, rng);
      return _attack(actor, _findUnit(act.targetId));
    }
    // 味方
    let action;
    if (actor.id === 'yuito') {
      action = playerAction;
    } else if (S && S.chooseAllyAction) {
      action = S.chooseAllyAction(actor, state.party, enemies, rng);
    } else {
      action = { type: 'attack', targetId: (_aliveEnemies()[0] || {}).id };
    }
    if (!action) return null;
    switch (action.type) {
      case 'wait':   return null;
      case 'flee':   return null; // 逃走は resolve 前に処理済み
      case 'defend': actor._defending = true; return [actor.name + 'は みをまもっている！'];
      case 'attack': return _attack(actor, _findUnit(action.targetId));
      case 'skill':  return _useSkill(actor, action.skillId, action.targetId);
      case 'item':   return _useItemAction(actor, action.itemId, action.targetId);
      case 'cover': {
        actor._covering = action.targetId;
        const tg = _findUnit(action.targetId);
        return [actor.name + 'は ' + (tg ? tg.name : 'なかま') + 'を かばう！'];
      }
      default: return null;
    }
  }

  // ── ラウンド進行 ──
  function _startCommandPhase() {
    round += 1;
    state.party.forEach((p) => { p._defending = false; p._covering = null; });
    if (_isDead(_yuito())) {
      // ユイトが倒れていても仲間が生きていれば自動で1ラウンド回す
      playerAction = { type: 'wait' };
      _startResolve();
      return;
    }
    phase = 'command';
    cmdMode = 'root';
    cursor = 0;
    _buildRootMenu();
  }

  function _attemptFlee() {
    const pSpd = _yuito().spd || 8;
    const foes = _aliveEnemies();
    const eAvg = foes.length ? foes.reduce((s, e) => s + (e.spd || 0), 0) / foes.length : 0;
    let ch = 0.5 + (pSpd - eAvg) * 0.05;
    if (ch < 0.25) ch = 0.25;
    if (ch > 0.95) ch = 0.95;
    return rng.chance(ch);
  }

  function _startResolve() {
    if (playerAction && playerAction.type === 'flee') {
      if (_attemptFlee()) {
        phase = 'over';
        _showMessages(['ユイトたちは うまく にげだした！'], _popToField);
        return;
      }
      playerAction = { type: 'wait' };
      fleeFailMsg = true;
    }
    actionQueue = buildTurnOrder(_aliveParty().concat(_aliveEnemies()));
    aqIndex = 0;
    phase = 'resolve';
    if (fleeFailMsg) {
      fleeFailMsg = false;
      _showMessages(['しかし まわりこまれて にげられない！'], _resolveStep);
    } else {
      _resolveStep();
    }
  }

  function _resolveStep() {
    while (aqIndex < actionQueue.length) {
      const actor = actionQueue[aqIndex++];
      if (_isDead(actor)) continue;
      const pages = _performAction(actor);
      if (!pages || !pages.length) continue; // 無音スキップ
      if (_enemiesCleared()) { phase = 'over'; _showMessages(pages, _onVictory); return; }
      if (_partyWiped())     { phase = 'over'; _showMessages(pages, _onDefeat);  return; }
      _showMessages(pages, _resolveStep);
      return;
    }
    _startCommandPhase();
  }

  function _onVictory() {
    const reward = calcReward(enemies);
    state.gold = (state.gold || 0) + reward.gold;
    const SKILLS = (S && S.SKILLS) || {};
    const pages = ['てきを たおした！',
      'けいけんち ' + reward.exp + ' かくとく！\n' + reward.gold + 'ゴールド てにいれた！'];
    _aliveParty().forEach((m) => {
      if (!(S && S.gainExp)) return;
      const res = S.gainExp(m, reward.exp);
      if (res.leveledUp) pages.push(m.name + 'は レベル ' + m.level + 'に あがった！');
      (res.learned || []).forEach((sid) => {
        const sk = SKILLS[sid];
        if (sk) pages.push(m.name + 'は 「' + sk.name + '」を おぼえた！');
      });
    });
    if (S && S.saveGame) S.saveGame(state);
    _showMessages(pages, _popToField);
  }

  function _onDefeat() {
    // やさしい難易度：ゲームオーバーにせず全回復で立て直す
    state.party.forEach((m) => { m.dead = false; m.hp = m.maxHp; m.mp = m.maxMp; });
    if (S && S.saveGame) S.saveGame(state);
    _showMessages([
      'ぜんいん たおれてしまった…',
      'でも ユイトたちは あきらめない！',
      'きあいで たちあがった！（HP かいふく）',
    ], _popToField);
  }

  function _popToField() {
    if (S && S.popScene) S.popScene();
  }

  // ── コマンドメニュー ──
  function _buildRootMenu() {
    menuList = [
      { label: 'たたかう', v: 'attack' },
      { label: 'とくぎ',   v: 'skill' },
      { label: 'どうぐ',   v: 'item' },
      { label: 'ぼうぎょ', v: 'defend' },
      { label: 'にげる',   v: 'flee' },
    ];
    cmdMode = 'root';
    cursor = 0;
  }

  function _enterSkill() {
    const SKILLS = (S && S.SKILLS) || {};
    const y = _yuito();
    const list = (y.skills || [])
      .map((id) => SKILLS[id])
      .filter((s) => s && (s.type === 'attack' || s.type === 'heal' || s.type === 'buff_def') && y.mp >= s.mp)
      .map((s) => ({ label: s.name + ' (' + s.mp + ')', v: s.id }));
    list.push({ label: 'もどる', v: '__back' });
    menuList = list;
    cmdMode = 'skill';
    cursor = 0;
  }

  function _enterItem() {
    const ITEMS = (S && S.ITEMS) || {};
    const list = [];
    Object.keys(state.inventory || {}).forEach((id) => {
      const it = ITEMS[id];
      const c = state.inventory[id];
      if (it && it.kind === 'item' && c > 0) list.push({ label: it.name + ' x' + c, v: id });
    });
    list.push({ label: 'もどる', v: '__back' });
    menuList = list;
    cmdMode = 'item';
    cursor = 0;
  }

  function _enterTarget(kind, payload) {
    targetKind = kind;
    let list;
    if (kind === 'attack' || kind === 'skill') {
      list = _aliveEnemies().map((e) => ({ label: e.name, v: e.id }));
    } else {
      const includeDead = (kind === 'item' && payload && payload.effect && ('revive' in payload.effect));
      list = state.party
        .filter((p) => includeDead ? true : !_isDead(p))
        .map((p) => ({ label: p.name + (_isDead(p) ? '（たおれた）' : ''), v: p.id }));
    }
    list.push({ label: 'もどる', v: '__back' });
    menuList = list;
    cmdMode = 'target';
    cursor = 0;
  }

  function _finalize(action) {
    playerAction = action;
    _startResolve();
  }

  function _menuBack() {
    if (cmdMode === 'skill' || cmdMode === 'item') { _buildRootMenu(); return; }
    if (cmdMode === 'target') {
      if (targetKind === 'attack') _buildRootMenu();
      else if (targetKind === 'skill') _enterSkill();
      else if (targetKind === 'item') _enterItem();
      else _buildRootMenu();
    }
    // root はキャンセル不可（何もしない）
  }

  function _menuSelect(item) {
    if (!item) return;
    if (cmdMode === 'root') {
      switch (item.v) {
        case 'attack': _enterTarget('attack', null); break;
        case 'skill':  _enterSkill(); break;
        case 'item':   _enterItem(); break;
        case 'defend': _yuito()._defending = true; _finalize({ type: 'defend' }); break;
        case 'flee':   _finalize({ type: 'flee' }); break;
      }
      return;
    }
    if (cmdMode === 'skill') {
      if (item.v === '__back') { _buildRootMenu(); return; }
      const SKILLS = (S && S.SKILLS) || {};
      const sk = SKILLS[item.v];
      pendingSkill = sk;
      if (sk.type === 'heal') {
        if (sk.target === 'allies') _finalize({ type: 'skill', skillId: sk.id });
        else _enterTarget('skill_heal', sk);
      } else if (sk.type === 'buff_def') {
        _finalize({ type: 'skill', skillId: sk.id });
      } else { // attack
        if (sk.target === 'all') _finalize({ type: 'skill', skillId: sk.id });
        else _enterTarget('skill', sk);
      }
      return;
    }
    if (cmdMode === 'item') {
      if (item.v === '__back') { _buildRootMenu(); return; }
      const ITEMS = (S && S.ITEMS) || {};
      pendingItem = item.v;
      _enterTarget('item', ITEMS[item.v]);
      return;
    }
    if (cmdMode === 'target') {
      if (item.v === '__back') { _menuBack(); return; }
      const targetId = item.v;
      if (targetKind === 'attack') _finalize({ type: 'attack', targetId });
      else if (targetKind === 'skill' || targetKind === 'skill_heal')
        _finalize({ type: 'skill', skillId: pendingSkill.id, targetId });
      else if (targetKind === 'item')
        _finalize({ type: 'item', itemId: pendingItem, targetId });
    }
  }

  function _handleCommand(pressed) {
    if (!menuList.length) return;
    if (pressed.up)    cursor = (cursor - 1 + menuList.length) % menuList.length;
    if (pressed.down)  cursor = (cursor + 1) % menuList.length;
    if (pressed.cancel) { _menuBack(); return; }
    if (pressed.confirm) _menuSelect(menuList[cursor]);
  }

  // ── 描画 ──
  function _now() { return (typeof Date !== 'undefined' && Date.now) ? Date.now() : 0; }

  function _drawBar(ctx, x, y, w, h, ratio, color, bg) {
    ratio = Math.max(0, Math.min(1, ratio || 0));
    ctx.fillStyle = bg || 'rgba(0,0,0,0.5)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, Math.round(w * ratio), h);
  }

  function _blob(ctx, cx, cy, r) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function _drawEnemyShape(ctx, e, cx, cy, size) {
    const COL = {
      foul_goblin:    { b: '#5bbf5b', d: '#2f7a2f', eye: '#ffe24a' },
      offside_ghost:  { b: '#cfe8ff', d: '#8fb8e0', eye: '#3a4a6a' },
      hand_monster:   { b: '#e8924a', d: '#a85f24', eye: '#ffffff' },
      yellowcard_bat: { b: '#f5d84a', d: '#bf9e10', eye: '#3a2a00' },
      redcard_devil:  { b: '#e0556b', d: '#8f2436', eye: '#ffd76e' },
      guardian:       { b: '#9aa0ac', d: '#5a606c', eye: '#5ec8ff' },
      dark_kaiser:    { b: '#6a4bce', d: '#3a2a7a', eye: '#ff5a7a' },
    };
    const c = COL[e.baseId] || { b: '#a0506e', d: '#6e2f48', eye: '#ffffff' };
    if (S && S.drawShadow) S.drawShadow(ctx, cx, cy + size * 0.55, size * 0.5, size * 0.16);
    ctx.save();
    if (e.baseId === 'offside_ghost') ctx.globalAlpha = 0.85;
    ctx.fillStyle = c.d; _blob(ctx, cx, cy, size * 0.52);
    ctx.fillStyle = c.b; _blob(ctx, cx, cy, size * 0.46);
    const ex = size * 0.16, ey = -size * 0.08, er = size * 0.09;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx - ex, cy + ey, er, 0, Math.PI * 2);
    ctx.arc(cx + ex, cy + ey, er, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = c.eye;
    ctx.beginPath();
    ctx.arc(cx - ex, cy + ey, er * 0.5, 0, Math.PI * 2);
    ctx.arc(cx + ex, cy + ey, er * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function _drawBg(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#13294a');
    g.addColorStop(0.55, '#1c3a2a');
    g.addColorStop(1, '#0e2018');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
    // ピッチ（サッカー場）
    ctx.fillStyle = 'rgba(60,150,80,0.35)';
    ctx.beginPath();
    if (ctx.ellipse) ctx.ellipse(VW / 2, 150, 150, 55, 0, 0, Math.PI * 2);
    else ctx.rect(20, 110, VW - 40, 80);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(VW / 2, 95);
    ctx.lineTo(VW / 2, 205);
    ctx.stroke();
  }

  function _drawEnemies(ctx) {
    const n = enemies.length || 1;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (_isDead(e)) continue;
      const span = 240 / n;
      const cx = 24 + span * (i + 0.5);
      const size = n === 1 ? 70 : (n === 2 ? 58 : 46);
      const cy = 95;
      _drawEnemyShape(ctx, e, cx, cy, size);
      if (S && S.drawText) {
        S.drawText(ctx, e.name, cx, cy + size * 0.6, { size: 10, color: '#eef', align: 'center', shadow: true });
      }
      _drawBar(ctx, cx - size * 0.42, cy + size * 0.6 + 13, size * 0.84, 4, e.hp / e.maxHp, '#5bd75b', 'rgba(0,0,0,0.5)');
      // ターゲット選択中のマーカー
      if (cmdMode === 'target' && (targetKind === 'attack' || targetKind === 'skill')
          && menuList[cursor] && menuList[cursor].v === e.id) {
        if (Math.floor(_now() / 300) % 2 === 0 && S && S.drawText) {
          S.drawText(ctx, '▼', cx, cy - size * 0.72, { size: 16, color: '#ffd76e', align: 'center' });
        }
      }
    }
  }

  function _drawPartyStrip(ctx) {
    if (!(S && S.drawWindow)) return;
    const p = state.party, n = p.length || 1;
    S.drawWindow(ctx, AX, PSY, AW, PSH, { radius: 8, border: '#3a5a8a' });
    const colW = AW / n;
    for (let i = 0; i < p.length; i++) {
      const m = p[i];
      const cx = AX + colW * i + colW / 2;
      const dead = _isDead(m);
      S.drawText(ctx, m.name, cx, PSY + 3, { size: 10, color: dead ? '#7788aa' : '#ffffff', align: 'center' });
      const bx = AX + colW * i + 6, bw = colW - 12;
      _drawBar(ctx, bx, PSY + 16, bw, 7, dead ? 0 : m.hp / m.maxHp, '#5bd75b', 'rgba(0,0,0,0.5)');
      S.drawText(ctx, dead ? 'ダウン' : (m.hp + '/' + m.maxHp), cx, PSY + 16, { size: 8, color: '#ffffff', align: 'center' });
      _drawBar(ctx, bx, PSY + 26, bw, 4, dead ? 0 : m.mp / Math.max(1, m.maxMp), '#5aa0ff', 'rgba(0,0,0,0.5)');
    }
  }

  function _drawActionMenu(ctx) {
    if (!(S && S.drawWindow && S.drawText)) return;
    S.drawWindow(ctx, AX, ACY, AW, ACH, { radius: 8, border: '#5ec8ff' });
    const list = menuList || [];
    const rowH = Math.min(20, (ACH - 16) / Math.max(1, list.length));
    for (let i = 0; i < list.length; i++) {
      const y = ACY + 10 + i * rowH;
      if (i === cursor) S.drawText(ctx, '▶', AX + 10, y, { size: 14, color: '#ffd76e' });
      S.drawText(ctx, list[i].label, AX + 28, y, { size: 14, color: i === cursor ? '#ffffff' : '#cfe0ff' });
    }
  }

  function _drawMessage(ctx) {
    if (!(S && S.drawWindow && S.drawText)) return;
    S.drawWindow(ctx, AX, ACY, AW, ACH, { radius: 8, border: '#5ec8ff' });
    const vis = _msg.getVisibleText ? _msg.getVisibleText() : '';
    const lines = (S.wrapText ? S.wrapText(vis, 17) : [vis]);
    for (let i = 0; i < lines.length; i++) {
      S.drawText(ctx, lines[i], AX + 12, ACY + 12 + i * 20, { size: 14, color: '#dff4ff' });
    }
    if (_msg.isPageComplete && _msg.isPageComplete() && !(_msg.isDone && _msg.isDone())) {
      if (Math.floor(_now() / 400) % 2 === 0) {
        S.drawText(ctx, '▼', AX + AW - 24, ACY + ACH - 22, { size: 12, color: '#5ec8ff' });
      }
    }
  }

  // ── 開始 ──
  if (!enemies.length) _showMessages(['…てきは いなかった。'], _popToField);
  else _showMessages([_introText()], _startCommandPhase);

  return {
    update: function (dt, input) {
      if (!S) return;
      const pressed = (input && input.pressed) || {};
      if (_msg) {
        const r = _msg.update(dt, !!pressed.confirm);
        if (r && r.done) {
          const cb = _msgDone;
          _msg = null; _msgDone = null;
          if (cb) cb();
        }
        return;
      }
      if (phase === 'command') _handleCommand(pressed);
    },
    draw: function (ctx) {
      if (!S) return;
      _drawBg(ctx);
      _drawEnemies(ctx);
      _drawPartyStrip(ctx);
      if (_msg) _drawMessage(ctx);
      else if (phase === 'command') _drawActionMenu(ctx);
    },
  };
}

(function (root, api) {
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (typeof window !== 'undefined') root.SRPG = Object.assign(root.SRPG || {}, api);
})(typeof window !== 'undefined' ? window : globalThis,
   { createBattleScene, spawnEnemies, buildTurnOrder, chooseEnemyAction, calcReward });

// === src/main.js ===
// === main.js ===
// 起動エントリ。window がある時だけ動く（Node で読まれても副作用ゼロ）。
// canvas#game → initCanvas → initInput → タイトルシーン push → rAF ループ。

(function () {
  if (typeof window === 'undefined') return; // Node では何もしない

  function start() {
    var S = window.SRPG;
    var canvas = document.getElementById('game');
    if (!canvas) {
      console.error('[main] canvas#game が見つかりません');
      return;
    }

    S.initCanvas(canvas);
    S.initInput(canvas);

    // タイトル画面からゲームを開始する（Task9 〜）
    S.pushScene(S.createTitleScene());

    var last = (typeof performance !== 'undefined' && performance.now)
      ? performance.now() : Date.now();

    function frame(now) {
      var dt = (now - last) / 1000;
      if (dt > 0.1) dt = 0.1; // 大きなフレーム飛びを抑制
      last = now;

      var input = S.pollInput();

      S.updateScenes(dt, input);

      var ctx = S.getCtx();
      if (ctx) {
        ctx.clearRect(0, 0, S.VW, S.VH);
        S.drawScenes(ctx);
        S.drawPad(ctx); // パッドは最前面
      }

      window.requestAnimationFrame(frame);
    }

    window.requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
